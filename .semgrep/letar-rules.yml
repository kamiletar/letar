# Правила semgrep, специфичные для letar.
#
# Зачем свои: готовые наборы (p/typescript, p/javascript, p/secrets) ловят захардкоженные
# ключи, но ничего не знают про Prisma/ZenStack. Проверено на положительном контроле
# 2026-08-10: `$queryRawUnsafe('... ' + userId)` базовыми наборами НЕ ловится.
#
# Каждое правило здесь — исполняемая версия запрета, который до этого жил только текстом
# в .claude/rules/security.md. Текст остаётся (он объясняет «почему»), правило проверяет.
#
# Запускается из scripts/hooks/pre-commit-semgrep.sh по staged-файлам.
# Ручной прогон по всему репо:
#   uvx semgrep scan --config .semgrep/letar-rules.yml apps libs

rules:
  - id: letar-prisma-raw-unsafe-concat
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Конкатенация в $queryRawUnsafe/$executeRawUnsafe — SQL-инъекция. Используй тегированный
      шаблон ($queryRaw`...`), который параметризует значения, либо обычные методы ORM
      (findUnique/findMany). См. .claude/rules/security.md § SQL Injection защита.
    patterns:
      - pattern-either:
          - pattern: $DB.$queryRawUnsafe($X + $Y, ...)
          - pattern: $DB.$executeRawUnsafe($X + $Y, ...)
          - pattern: $DB.$queryRawUnsafe(`...${$X}...`, ...)
          - pattern: $DB.$executeRawUnsafe(`...${$X}...`, ...)

  - id: letar-dangerously-set-inner-html-unsanitized
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      dangerouslySetInnerHTML без санитизации — XSS. Пропусти через DOMPurify.sanitize()
      либо отдай текстом, React сам экранирует. См. .claude/rules/security.md § XSS защита.
    # ⚠️ Паттерны — блочными скалярами: двоеточие в `__html:` ломает инлайновый YAML
    # («mapping values are not allowed here»).
    patterns:
      - pattern: |
          <$EL dangerouslySetInnerHTML={{ __html: $HTML }} />
      - pattern-not: |
          <$EL dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(...) }} />
      - pattern-not: |
          <$EL dangerouslySetInnerHTML={{ __html: sanitize(...) }} />

  # Та же дыра, но записанная через промежуточную переменную:
  #   const dangerProp = { __html: html }
  #   <script dangerouslySetInnerHTML={dangerProp} />
  # Узкий паттерн выше её не видит (проверено на apps/aboi catalog/[slug]/page.tsx).
  # Здесь нельзя понять, санитизирован ли html, поэтому WARNING: коммит не блокируется,
  # но место попадает в глаза. Легитимный случай — JSON-LD из JSON.stringify.
  - id: letar-dangerously-set-inner-html-indirect
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      dangerouslySetInnerHTML через переменную — проверь, что источник санитизирован
      (DOMPurify) или сгенерирован кодом (JSON.stringify для JSON-LD), а не пришёл от
      пользователя. См. .claude/rules/security.md § XSS защита.
    patterns:
      - pattern: |
          <$EL dangerouslySetInnerHTML={$PROP} />
      - pattern-not: |
          <$EL dangerouslySetInnerHTML={{ __html: $HTML }} />

  - id: letar-path-traversal-naive-startswith-guard
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      path.join()/path.resolve() + .startsWith() как защита от path traversal не работает:
      join/resolve сами схлопывают '..' до самой проверки, а startsWith сравнивает строки, не
      пути ('/uploads-evil' проходит startsWith('/uploads')). Используй resolveUploadPath() из
      @letar/image-upload/server. См. .claude/docs/upload-path-traversal.md.
    patterns:
      - pattern-either:
          - pattern: |
              $TARGET = path.join($ROOT, ...)
              ...
              if (!$TARGET.startsWith($ROOT)) { ... }
          - pattern: |
              $TARGET = path.resolve($ROOT, ...)
              ...
              if (!$TARGET.startsWith($ROOT)) { ... }

  - id: letar-nextjs-image-priority-deprecated
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Next.js 16 разделил проп `priority` у next/image на независимые `preload` и
      `fetchPriority` — устаревший `priority` больше не проставляет браузеру
      `fetchpriority="high"` на LCP-изображении, а typecheck это не ловит. Передавай
      `preload` и `fetchPriority="high"` явно вместо `priority`. Готовая обёртка —
      CoverImage из @letar/ui. См. apps/domwellbes/PLAN_PUBLIC_MOBILE.md §12.24.
    patterns:
      - pattern-either:
          - pattern-inside: |
              import Image from 'next/image'
              ...
          - pattern-inside: |
              import NextImage from 'next/image'
              ...
      - pattern-either:
          - pattern: <Image ... priority ... />
          - pattern: <Image ... priority={...} ... />
          - pattern: <NextImage ... priority ... />
          - pattern: <NextImage ... priority={...} ... />
      - pattern-not: <Image ... preload ... />
      - pattern-not: <Image ... preload={...} ... />
      - pattern-not: <Image ... fetchPriority={...} ... />
      - pattern-not: <NextImage ... preload ... />
      - pattern-not: <NextImage ... preload={...} ... />
      - pattern-not: <NextImage ... fetchPriority={...} ... />

  - id: letar-chakra-as-prop-forbidden
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Проп as="..."/as={Component} на Chakra-компоненте запрещён — используй ТОЛЬКО
      asChild + нативный HTML-элемент внутри. См. .claude/rules/components.md,
      apps/aboi/src/app/[locale]/_components/home/scale.tsx как образец.
      ⚠️ Severity временно понижена с ERROR до WARNING (2026-08-26) — 1434 существующих
      срабатывания по репо (в основном `<Icon as={IconComponent}>` в libs/video-player-react
      и libs/ui), не связанных с текущей правкой, иначе блокировали бы pre-commit любого
      несвязанного коммита в эти файлы. Поднять обратно до ERROR после поэтапной чистки —
      см. apps/aboi/PLAN.md.
    patterns:
      - pattern-either:
          - pattern: <$COMPONENT ... as="$TAG" ... />
          - pattern: <$COMPONENT ... as={$TAG} ... />
      - metavariable-regex:
          metavariable: $COMPONENT
          regex: ^[A-Z]

  # ⚠️ AST-паттерн `<$FORM.Field.Number name="$NAME" ... />` (metavariable как объект
  # трёхуровневого JSX member-expression типа DomWellbesForm.Field.Number) НЕ матчится вовсе —
  # проверено эмпирически (2026-09-09): с буквальным именем компонента вместо метапеременной
  # правило находит все 10 вхождений в контрольном файле, с `$FORM` — 0. Каждое приложение
  # монорепо заводит свой `createForm()`-инстанс под собственным именем (DomWellbesForm,
  # DrivingSchoolForm, ...) — перечислить их все литералом нельзя, писать отдельное правило на
  # каждое приложение бессмысленно. Поэтому здесь `pattern-regex` (language: generic) вместо
  # AST-паттерна — грубее (не видит контекста JSX-дерева), но матчит текст независимо от имени
  # инстанса формы.
  - id: letar-forms-number-field-money-or-percent-name
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - '*.tsx'
    message: >-
      Имя поля выглядит как деньги (…Kopecks) или проценты (…Pct/…Percent), но привязано к
      Field.Number. В @letar/forms есть Field.Currency (форматирование + minorUnitScale для
      копеек↔рублей на границе поля) и Field.Percentage (0-100). Field.Number отдаёт сырое
      число без форматирования и легко теряет единицы измерения на глаз. Проверь
      `form-mcp list_fields`, прежде чем оставлять Field.Number — если это осознанный выбор
      (например поле хранит долю 0-1, а не проценты 0-100 — Field.Percentage бы испортил
      данные — или значение намеренно не форматируется), оставь как есть.
      См. .claude/rules/forms.md, apps/domwellbes/PLAN_OBSERVATIONS.md (money-field-kopecks).
    pattern-regex: '\.Field\.Number\b[^>]*\bname="[A-Za-z]*(Kopecks|Pct|Percent)"'

  - id: letar-forms-string-field-specialized-name
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - '*.tsx'
    message: >-
      Имя поля похоже на домен со специализированным компонентом в @letar/forms:
      ИНН/КПП/ОГРН/БИК/СНИЛС/паспорт — Form.Document.* (реальная checksum-валидация вместо
      голой строки); телефон — Field.Phone; город/адрес — Field.City/Field.Address (только
      если в приложении настроен DaData-токен — без него они деградируют до обычного текста,
      проверь перед заменой). Field.String ничего из этого не даёт. Проверь
      `form-mcp list_fields`/`get_directives`, прежде чем оставлять Field.String.
      ⚠️ `createForm()` не переносит группу Form.Document.* на свой инстанс — если её ещё нет
      на инстансе приложения, доклей вручную по образцу
      apps/domwellbes/src/domwellbes-form/domwellbes-form.tsx. См. .claude/rules/forms.md.
    pattern-regex: '\.Field\.String\b[^>]*\bname="(inn|kpp|ogrn|bik|snils|passport|phone|[A-Za-z]*Phone|city|[A-Za-z]*City)"'

  # ⚠️ Severity WARNING сразу, не временное понижение (в отличие от letar-chakra-as-prop-forbidden
  # выше) — при заводе правила уже 357 срабатываний в 108 файлах почти во всех приложениях
  # монорепо (аудит 2026-09-12, .claude/rules/forms.md уже запрещает это текстом, но правило не
  # исполняемо и не грузится в контекст агента вне *-form.tsx/*Form.tsx — эта проверка тот же
  # разрыв закрывает на уровне git-хука, для любого файла). Поднимать до ERROR нет смысла: долг
  # такого масштаба сразу заблокировал бы почти любой коммит в затронутые приложения.
  - id: letar-forms-raw-select-combobox-outside-lib
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - '*.tsx'
      exclude:
        - libs/forms/**
        - libs/forms-core/**
        - libs/forms-react/**
        - libs/forms-shadcn/**
        - libs/forms-vue/**
        - libs/forms-vue-shadcn/**
        - libs/forms-angular/**
    message: >-
      Сырой Chakra NativeSelect.Root/Select.Root/Combobox.Root вне @letar/forms — даже готовые
      внутренние Select/Combobox для extraSelects/extraComboboxes (см. образец
      apps/driving-school/src/driving-school-form/selects/) оборачивают @letar/forms
      FieldSelect/Form.Field.Combobox, а не эти примитивы напрямую. Ad-hoc дропдаун вне
      createForm()-инстанса — URL-фильтр, per-row контрол таблицы, ad-hoc-панель — тоже должен
      идти через createForm() (микро-форма + Form.Watch/Form.UrlSync), не через голый Chakra.
      См. .claude/rules/forms.md § «Не делай» (правило про NativeSelect/Select.Root).
    pattern-regex: '<(NativeSelect|Select|Combobox)\.Root\b'

  - id: letar-dev-session-vars-in-prod-env
    languages: [generic]
    paths:
      include:
        - '*.env.docker'
        - '*.env.production'
    severity: ERROR
    message: >-
      ALLOW_DEV_SESSION/DEV_SESSION_TOKEN в прод-конфиге открывают бэкдор-эндпоинт
      /api/auth/dev-session — создание сессии для любого email без пароля. Эта пара живёт
      ТОЛЬКО в .env.staging. См. .claude/rules/env-files.md.
    pattern-either:
      - pattern: ALLOW_DEV_SESSION=$X
      - pattern: DEV_SESSION_TOKEN=$X
