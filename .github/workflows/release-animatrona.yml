# Автоматический релиз Animatrona для всех платформ
# Триггер: git push origin animatrona-vX.Y.Z
# Результат: релиз с бинарниками прямо в kamiletar/letar — без зеркалирования исходников в
# отдельный репозиторий (kamiletar/animatrona — устаревшая схема, снята 2026-09-13). Разбор
# причины и общая схема для всех Electron-приложений этого монорепо —
# .claude/docs/electron-monorepo-shared-releases.md

name: Release Animatrona

on:
  push:
    tags:
      - 'animatrona-v*.*.*'

# Релиз пишется в тот же репозиторий (kamiletar/letar), поэтому штатного GITHUB_TOKEN
# достаточно — PAT не нужен.
permissions:
  contents: write

jobs:
  # 1. Создание draft release с notes из CHANGELOG
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse-version.outputs.version }}
      tag: ${{ steps.parse-version.outputs.tag }}

    steps:
      - name: Checkout letar monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: parse-version
        run: |
          # animatrona-v0.55.72 → 0.55.72
          VERSION=${GITHUB_REF#refs/tags/animatrona-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.parse-version.outputs.version }}"
          CHANGELOG="apps/animatrona/CHANGELOG.md"

          NOTES=$(awk '/## \['"$VERSION"'\]/{flag=1; next} /## \[/{flag=0} flag' "$CHANGELOG")

          if [ -z "$NOTES" ]; then
            # Fallback: последние коммиты по каталогу приложения
            NOTES=$(git log --pretty=format:"- %s" -10 --no-merges -- apps/animatrona/ libs/query-provider/)
          fi

          # Экранируем для GitHub Actions (многострочный output)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.parse-version.outputs.tag }}" \
            --repo kamiletar/letar \
            --draft \
            --title "Animatrona ${{ steps.parse-version.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.notes }}"

          echo "Created draft release: ${{ steps.parse-version.outputs.tag }}"

  # 2. Сборка Windows
  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout letar monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build zenstack-form-plugin
        run: cd libs/zenstack-form-plugin && npx tsc --project tsconfig.lib.json && cd ../..

      - name: Generate ZenStack
        run: |
          bunx zenstack generate --schema apps/animatrona/schema.zmodel
          bunx prisma generate --schema apps/animatrona/renderer/src/generated/schema.prisma

      - name: Download FFmpeg
        working-directory: apps/animatrona
        run: bunx tsx scripts/download-ffmpeg.ts --platform win

      - name: Download fpcalc
        working-directory: apps/animatrona
        run: bunx tsx scripts/download-fpcalc.ts --platform win

      - name: Build Windows
        working-directory: apps/animatrona
        run: |
          bunx tsx scripts/update-splash-version.ts
          cd renderer && bunx next build --webpack && cd ..
          bunx tsx scripts/fix-standalone.ts
          bunx webpack --config main/webpack.config.js
          node web-player/build.mjs --prod
          cd mobile-ui && bun run build && cd ..
          bunx electron-builder --win --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Rename assets to dash-separated names (must match latest.yml)
        # electron-builder кладёт в dist/*.exe/*.blockmap имена с пробелами
        # ("Animatrona Setup 0.55.72.exe"), а latest.yml внутри ссылается на дефисный вариант
        # ("Animatrona-Setup-0.55.72.exe"). `gh release upload` сам заменяет пробелы на точки,
        # не на дефисы — переименовываем заранее, иначе electron-updater получит 404.
        # Разбор — .claude/docs/electron-monorepo-shared-releases.md.
        working-directory: apps/animatrona/dist
        shell: bash
        run: |
          for f in *.exe *.exe.blockmap; do
            [ -e "$f" ] || continue
            mv -- "$f" "$(echo "$f" | tr ' ' '-')"
          done
          ls -la

      - name: Upload to release
        working-directory: apps/animatrona/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ needs.create-release.outputs.tag }}"
          $FILES = Get-ChildItem -Path *.exe, *.exe.blockmap, latest.yml -ErrorAction SilentlyContinue

          if ($FILES.Count -eq 0) {
            Write-Host "⚠️ No release files found"
            exit 1
          }

          foreach ($FILE in $FILES) {
            Write-Host "Uploading $($FILE.Name) to release $TAG"
            gh release upload "$TAG" "$($FILE.FullName)" --repo kamiletar/letar --clobber
          }

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: animatrona-windows
          path: |
            apps/animatrona/dist/*.exe
            apps/animatrona/dist/latest.yml
          retention-days: 7

  # 3. Сборка macOS
  build-macos:
    needs: create-release
    runs-on: macos-14 # M1 — дешевле Intel

    steps:
      - name: Checkout letar monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build zenstack-form-plugin
        run: cd libs/zenstack-form-plugin && npx tsc --project tsconfig.lib.json && cd ../..

      - name: Generate ZenStack
        run: |
          bunx zenstack generate --schema apps/animatrona/schema.zmodel
          bunx prisma generate --schema apps/animatrona/renderer/src/generated/schema.prisma
          ln -sf "$(pwd)/apps/animatrona/prisma/migrations" "apps/animatrona/renderer/src/generated/migrations"

      - name: Download FFmpeg
        working-directory: apps/animatrona
        run: bunx tsx scripts/download-ffmpeg.ts --platform mac

      - name: Build macOS
        working-directory: apps/animatrona
        run: |
          bunx tsx scripts/update-splash-version.ts
          cd renderer && bunx next build --webpack && cd ..
          bunx webpack --config main/webpack.config.js
          node web-player/build.mjs --prod
          cd mobile-ui && bun run build && cd ..
          bunx electron-builder --mac --publish never

      - name: Rename assets to dash-separated names (must match latest-mac.yml)
        working-directory: apps/animatrona/dist
        run: |
          for f in *.dmg *.dmg.blockmap *.zip *.zip.blockmap; do
            [ -e "$f" ] || continue
            mv -- "$f" "$(echo "$f" | tr ' ' '-')"
          done
          ls -la

      - name: Upload to release
        working-directory: apps/animatrona/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          shopt -s nullglob
          FILES=(*.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "⚠️ No release files found"
            exit 1
          fi

          for FILE in "${FILES[@]}"; do
            echo "Uploading $FILE to release $TAG"
            gh release upload "$TAG" "$FILE" --repo kamiletar/letar --clobber
          done

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: animatrona-macos
          path: |
            apps/animatrona/dist/*.dmg
            apps/animatrona/dist/latest-mac.yml
          retention-days: 7

  # 4. Сборка Linux (в монорепо — нужны @letar/* библиотеки)
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout letar monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build zenstack-form-plugin
        run: cd libs/zenstack-form-plugin && tsc --project tsconfig.lib.json && cd ../..

      - name: Generate ZenStack
        run: |
          bunx zenstack generate --schema apps/animatrona/schema.zmodel
          bunx prisma generate --schema apps/animatrona/renderer/src/generated/schema.prisma
          ln -sf "$(pwd)/apps/animatrona/prisma/migrations" "apps/animatrona/renderer/src/generated/migrations"

      - name: Download FFmpeg
        working-directory: apps/animatrona
        run: bunx tsx scripts/download-ffmpeg.ts --platform linux

      - name: Build Linux
        working-directory: apps/animatrona
        run: |
          bunx tsx scripts/update-splash-version.ts
          cd renderer && bunx next build --webpack && cd ..
          bunx webpack --config main/webpack.config.js
          node web-player/build.mjs --prod
          cd mobile-ui && bun run build && cd ..
          bunx electron-builder --linux --publish never

      - name: Rename assets to dash-separated names (must match latest-linux.yml)
        working-directory: apps/animatrona/dist
        run: |
          for f in *.AppImage *.AppImage.blockmap; do
            [ -e "$f" ] || continue
            mv -- "$f" "$(echo "$f" | tr ' ' '-')"
          done
          ls -la

      - name: Upload to release
        working-directory: apps/animatrona/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          shopt -s nullglob
          FILES=(*.AppImage *.AppImage.blockmap latest-linux.yml)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "⚠️ No release files found"
            exit 1
          fi

          for FILE in "${FILES[@]}"; do
            echo "Uploading $FILE to release $TAG"
            gh release upload "$TAG" "$FILE" --repo kamiletar/letar --clobber
          done

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: animatrona-linux
          path: |
            apps/animatrona/dist/*.AppImage
            apps/animatrona/dist/latest-linux.yml
          retention-days: 7

  # 5. Публикация релиза
  publish-release:
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          echo "Publishing release $TAG"
          gh release edit "$TAG" --repo kamiletar/letar --draft=false
          echo "✅ Release published: https://github.com/kamiletar/letar/releases/tag/$TAG"

      - name: Revalidate landing page
        run: |
          RESPONSE=$(curl -X POST "https://animatrona.letar.best/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_CODE:%{http_code}" \
            -s)

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')

          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Landing page cache revalidated"
          else
            echo "⚠️ Failed to revalidate landing (HTTP $HTTP_CODE)"
            echo "Landing will update automatically within 1 hour"
          fi
