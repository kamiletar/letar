# CI-гейт качества: lint + typecheck + unit-тесты на затронутых проектах.
#
# Зачем: до 2026-08-10 в репозитории не было ни одного workflow, проверяющего код —
# только publish/release. Всё качество держалось на том, что агент не забыл прогнать
# проверки локально перед коммитом. Этот workflow ловит то, что забыли.
#
# ⚠️ Проверяется ТОЛЬКО публичная часть монорепо. Приватные submodule (aboi,
# driving-school, studio и др.) намеренно не выкачиваются — их checkout требует PAT,
# а публичный CI не должен иметь к ним доступ. Без них Nx просто не видит эти проекты
# в графе, и `affected` их не трогает. Гейт для приватных приложений — локальные
# прогоны + e2e перед деплоем, см. .claude/rules/deploy-coordination.md.
#
# E2E здесь НЕ запускаются: им нужны БД, поднятые сервисы и браузеры — это отдельный
# конвейер (`nx e2e <app>-e2e`, pre-deploy gate у deploy-agent).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый push отменяет предыдущий незавершённый прогон той же ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `zenstack:generate` (зависимость `test` у приложений с БД) вызывает `prisma generate`,
    # которому достаточно синтаксически валидного DATABASE_URL — реального коннекта к БД он
    # не делает. Без переменной падает с PrismaConfigEnvError и тянет за собой зависимый `test`.
    #
    # VITE_CONFIG_NATIVE_IGNORE_WARNING — глушит безобидное предупреждение Vite 8
    # (`configLoader: 'native'`) про ESM-синтаксис в vitest.config.ts без "type": "module"
    # в соседнем package.json. На сборку/тесты не влияет (Vite сам откатывается на bundle-загрузчик),
    # но плодит по строке на каждый из ~20 проектов и захламляет лог. Массово чинить через
    # "type": "module" не стали — риск для require() в другом коде монорепо ради косметики.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

    # Часть unit-тестов (например animatrona-tracker/route.spec.ts) делает настоящие запросы
    # через ZenStack ORM, а не мокает БД — им нужен реальный Postgres, не просто синтаксически
    # валидная строка выше. Один сервер, отдельная БД на каждое такое приложение (шаг "Prepare
    # test databases" ниже) — общая плоская БД рискует коллизией имён таблиц между приложениями
    # (animatrona-tracker и svoichuzhie оба используют Better Auth модели User/Account/Session).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout (без приватных submodule — см. шапку файла)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # Определяет base/head для `nx affected`: base — последний коммит, на котором
      # этот workflow был зелёным, а не HEAD~1. Иначе после красного прогона
      # сломанные проекты выпадают из affected и ошибка «зарастает».
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ⚠️ Намеренно БЕЗ --frozen-lockfile. bun.lock собирается локально, где приватные
      # submodule выкачаны, поэтому в нём есть их workspace-записи (apps/aboi,
      # apps/driving-school, apps/dsperevod и др. — вместе с их эксклюзивными
      # зависимостями). В CI submodule не выкачиваются (см. шапку), эти каталоги пусты,
      # bun выкидывает записи из lockfile и с --frozen-lockfile падает на
      # «lockfile had changes, but lockfile is frozen».
      # Разовая ручная чистка lockfile (949b81c6) не держится: первый же локальный
      # `bun install` возвращает записи обратно — так и случилось в f8545c54.
      - name: Install dependencies
        id: install
        run: bun install

      # oxlint отрабатывает первым внутри таргета lint (fast-fail), затем ESLint.
      - name: Lint
        run: bunx nx affected -t lint --parallel=3

      # tsgo в 9–38x быстрее обычного typecheck (см. CLAUDE.md § Перед коммитом).
      #
      # `always()` здесь — чтобы падение lint не скрывало ошибки типов и тестов: за один
      # прогон видно весь список проблем. Но условие на install обязательно: без него
      # упавшая установка давала три ошибки подряд, где две последние —
      # «Could not find Nx modules» вместо настоящей причины.
      - name: Typecheck
        if: always() && steps.install.outcome == 'success'
        run: bunx nx affected -t typecheck:tsgo --parallel=3

      # Создаёт БД и накатывает схему для приложений, чьи unit-тесты бьют в настоящий Postgres
      # (см. комментарий у `services.postgres` выше). Имя БД должно совпадать с тем, что задано
      # в `test.env.DATABASE_URL` соответствующего `vitest.config.mts` — здесь это
      # animatrona_tracker_ci и svoichuzhie_ci (отдельная БД — у обоих приложений одноимённые
      # модели Better Auth User/Account/Session/Verification, общая БД рискует коллизией схем).
      # `prisma db push` идёт со своим DATABASE_URL на шаг (не job-level), чтобы не задеть
      # остальные проекты. Новое приложение с настоящим (не замоканным) Postgres в unit-тестах
      # добавляется сюда отдельной строкой + своим `test.env` в vitest.config.mts.
      - name: Prepare test databases
        if: always() && steps.install.outcome == 'success'
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U ci -d ci -c 'CREATE DATABASE animatrona_tracker_ci'
          bunx nx run animatrona-tracker:zenstack:generate
          DATABASE_URL=postgresql://ci:ci@localhost:5432/animatrona_tracker_ci bunx nx run animatrona-tracker:db:push
          psql -h localhost -U ci -d ci -c 'CREATE DATABASE svoichuzhie_ci'
          bunx nx run svoichuzhie:zenstack:generate
          DATABASE_URL=postgresql://ci:ci@localhost:5432/svoichuzhie_ci bunx nx run svoichuzhie:db:push

      # --parallel=2 (не 3, как у lint/typecheck) и ограничение воркеров vitest внутри каждого
      # проекта — иначе 3 nx-таски × собственный пул воркеров vitest на каждую одновременно
      # съедают память ubuntu-latest раннера, и процесс убивает OOM (exit code 130, а не
      # осмысленная ошибка теста — см. разбор run 32084469164). `--poolOptions.threads.*`
      # не подошёл: у CLI vitest 4 нет такого флага (`CACError: Unknown option`), пул по
      # умолчанию к тому же `forks`, не `threads` — верный флаг именно `--maxWorkers`.
      - name: Unit tests
        if: always() && steps.install.outcome == 'success'
        run: bunx nx affected -t test --parallel=2 -- --maxWorkers=2

      # Проверки целостности монорепо: патчи зависимостей, peer-диапазоны, дрейф
      # версий electron. Не про код конкретного проекта, поэтому вне `nx affected` —
      # они читают корневые package.json/bun.lock/node_modules и стоят ~5 секунд.
      #
      # Ключевая из них — patched-deps. `patchedDependencies` прибит к точной версии,
      # зависимость стоит по caret, и bun 1.3.14 при расхождении молчит (код 0, ни
      # строки) — патч просто перестаёт накладываться, а баг гидратации возвращается
      # во все ~30 приложений без единой ошибки сборки (PLAN-INFRA-4.md §118).
      #
      # ⚠️ Раннер запускается с `--ci`: в этом режиме он пропускает проверки, которым
      # нужны приватные submodule (здесь не выкачиваются, см. шапку файла), и ВСЛУХ
      # объявляет неполное покрытие там, где вход виден лишь частично — иначе
      # `check-electron-drift` молча зеленела бы, не увидев poster-microtext-desktop.
      # Проверки уровня `warn` (накопленный долг) прогон не роняют, только печатаются.
      - name: Integrity checks
        if: always() && steps.install.outcome == 'success'
        run: bun scripts/check-all.mjs --ci
