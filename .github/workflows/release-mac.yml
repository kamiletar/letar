# Сборка macOS версии Animatrona
# Запускается только для macOS (экономия минут — macOS = 10x)
# Windows и Linux собираются локально через nx release:win-linux

name: Release macOS

on:
  # Ручной запуск
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например v0.10.9)'
        required: false
        type: string

  # Автоматически при создании релиза
  release:
    types: [published]

jobs:
  build-mac:
    runs-on: macos-14 # M1 — быстрее и дешевле чем Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma/ZenStack
        run: bunx nx zenstack:generate animatrona

      - name: Build and Release macOS
        run: bunx nx release:mac animatrona
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Code Signing (опционально — без них сборка работает, но не подписана)
          # CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization (опционально)
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: animatrona-mac
          path: apps/animatrona/dist/*.dmg
          retention-days: 7

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/animatrona/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DMG_FILE=$(ls apps/animatrona/dist/*.dmg 2>/dev/null | head -1)

          if [ -z "$DMG_FILE" ]; then
            echo "No .dmg file found, skipping release upload"
            exit 0
          fi

          echo "Uploading $DMG_FILE to release $TAG"

          # Проверяем существует ли релиз
          if gh release view "$TAG" &>/dev/null; then
            # Загружаем в существующий релиз (перезаписываем если есть)
            gh release upload "$TAG" "$DMG_FILE" --clobber
            echo "✅ Uploaded to existing release $TAG"
          else
            echo "⚠️ Release $TAG not found, creating draft release"
            gh release create "$TAG" "$DMG_FILE" --draft --title "$TAG" --notes "macOS build"
            echo "✅ Created draft release $TAG"
          fi
