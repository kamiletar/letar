# Публикация npm-пакетов из letar по тегу <пакет>-v<версия> (trusted publishing через OIDC).
#
# Процедура выпуска и список шагов владельца — .claude/docs/npm-publish-from-monorepo.md.
# Кратко: поднять версию и CHANGELOG → коммит → push → тег `<пакет>-v<версия>` → push тега.
# Пакеты зависят друг от друга: теги ставят по порядку из scripts/data/npm-published-packages.json
# (forms-core, forms-react → forms → forms-query; zenstack-form-plugin и form-mcp — отдельно).
#
# Два job: `build` собирает и проверяет пакет БЕЗ прав на публикацию (там исполняется `bun install` и код
# из зависимостей), `publish` получает только готовый dist через artifact и держит id-token/contents:write.
#
# Токена npm здесь нет: публикует OIDC-идентичность этого workflow (Trusted Publisher, настраивается на
# npmjs.com для каждого пакета: репозиторий kamiletar/letar, workflow publish-npm.yml).
# `--provenance` прикладывает подписанное происхождение сборки. Секрет NPM_TOKEN не нужен и не используется.
#
# Ручной запуск (workflow_dispatch) по умолчанию — dry_run: собирает, проверяет и делает
# `npm publish --dry-run`, ничего не публикуя. Реальную публикацию делает только тег.
#
# Набор тегов и вариантов project должен совпадать с реестром scripts/data/npm-published-packages.json:
# это проверяет scripts/check-npm-package-integrity.mjs (gate `npm-package-integrity`).

name: Publish npm package

on:
  push:
    tags:
      - 'forms-core-v*.*.*'
      - 'forms-react-v*.*.*'
      - 'forms-v*.*.*'
      - 'forms-query-v*.*.*'
      - 'zenstack-form-plugin-v*.*.*'
      - 'form-mcp-v*.*.*'
  workflow_dispatch:
    inputs:
      project:
        description: 'Пакет (тег реестра)'
        required: true
        type: choice
        options:
          - forms-core
          - forms-react
          - forms
          - forms-query
          - zenstack-form-plugin
          - form-mcp
      dry_run:
        description: 'Только проверка и npm publish --dry-run (без публикации)'
        required: true
        type: boolean
        default: true

# Один выпуск за раз: два тега подряд не должны публиковаться параллельно (второй зависит от первого).
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Права минимальные: id-token и запись здесь не нужны, зависимости ставятся из реестра и исполняют код.
    permissions:
      contents: read

    env:
      # Значения из inputs и ref передаём через env, а не интерполяцией в run: так их нельзя использовать для инъекции.
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_PROJECT: ${{ github.event.inputs.project }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}

    outputs:
      dist: ${{ steps.preflight.outputs.dist }}
      name: ${{ steps.preflight.outputs.name }}
      version: ${{ steps.preflight.outputs.version }}
      disttag: ${{ steps.preflight.outputs.disttag }}
      dry_run: ${{ steps.target.outputs.dry_run }}
      release: ${{ steps.target.outputs.release }}

    steps:
      # Приватные submodule не нужны: публикуемые пакеты лежат в публичной части letar.
      - name: Checkout letar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Определить режим
        id: target
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # Тег публикуется по-настоящему; пакет по префиксу тега определяет preflight
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Версия закреплена (в ci.yml — latest): выпуск не должен меняться от выхода новой версии bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Без --frozen-lockfile, как в ci.yml: приватные submodule в CI не выкачиваются, и bun с замороженным
      # lockfile падает на «lockfile had changes» (см. комментарий у шага Install dependencies в ci.yml).
      # Риск дрейфа версий компенсирует проверка пакета и smoke-установка ниже, а сам job не имеет прав публикации.
      - name: Install dependencies
        run: bun install

      # Проверка пакета + сборка + порядок публикации (зависимости уже в реестре npm).
      # При ручном dry-run реестр не опрашивается: первые публикации нужных зависимостей могут ещё не состояться.
      - name: Preflight
        id: preflight
        env:
          DRY_RUN: ${{ steps.target.outputs.dry_run }}
        run: |
          ARGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ARGS+=(--project "$INPUT_PROJECT")
          else
            ARGS+=(--tag "$REF_NAME")
          fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--skip-registry); fi
          node scripts/npm-release-preflight.mjs "${ARGS[@]}"

      # Установка собранного tarball в чистые проекты (Next.js/Vite/ZenStack/MCP) — то, что видит потребитель.
      - name: Smoke-проверка в чистых проектах
        env:
          TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          case "$TAG" in
            forms-core|forms-react|forms|forms-query) PARTS="next,vite" ;;
            zenstack-form-plugin) PARTS="zenstack" ;;
            form-mcp) PARTS="mcp" ;;
            *) echo "неизвестный пакет $TAG"; exit 1 ;;
          esac
          node scripts/npm-smoke.mjs --only="$PARTS"

      - name: Сохранить dist для публикации
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: ${{ steps.preflight.outputs.dist }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write # GitHub release по тегу
      id-token: write # OIDC для trusted publishing и provenance

    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing требует npm не старше 11.5.1; версия закреплена, чтобы выпуск не менялся сам по себе.
      - name: Обновить npm до версии с trusted publishing
        run: npm install -g npm@11.6.2

      - name: Получить собранный dist
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: publish-dist

      # Публикующий job исполняет только `npm publish`: перед ним сверяем присланный dist с тем, что проверил build.
      # Скрипты жизненного цикла в манифесте запрещены, а `--ignore-scripts` ниже отключает их и на случай подмены.
      - name: Проверить манифест dist
        env:
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.disttag }}
        run: |
          node - <<'JS'
          const pj = JSON.parse(require('fs').readFileSync('publish-dist/package.json', 'utf8'))
          const bad = []
          if (pj.name !== process.env.EXPECTED_NAME || !/^@letar\/[a-z0-9-]+$/.test(pj.name)) bad.push('имя ' + pj.name)
          if (pj.version !== process.env.EXPECTED_VERSION) bad.push('версия ' + pj.version)
          if (pj.scripts && Object.keys(pj.scripts).length > 0) bad.push('scripts в манифесте')
          if (!/^[a-z][a-z0-9-]*$/.test(process.env.DIST_TAG)) bad.push('dist-tag ' + process.env.DIST_TAG)
          if (bad.length) {
            console.error('✖ dist не прошёл проверку: ' + bad.join('; '))
            process.exit(1)
          }
          console.log('✔ ' + pj.name + '@' + pj.version + ' → ' + process.env.DIST_TAG)
          JS

      # dist-tag передаём явно: npm 11.6 не применяет publishConfig.tag из package.json (в dry-run пишет «with tag latest»),
      # и без --tag первая версия ушла бы в latest, а не в next.
      - name: Публикация (dry-run)
        if: needs.build.outputs.dry_run == 'true'
        working-directory: publish-dist
        env:
          DIST_TAG: ${{ needs.build.outputs.disttag }}
        run: npm publish --ignore-scripts --provenance --tag "$DIST_TAG" --dry-run

      - name: Публикация в npm
        if: needs.build.outputs.dry_run != 'true'
        working-directory: publish-dist
        env:
          DIST_TAG: ${{ needs.build.outputs.disttag }}
        run: npm publish --ignore-scripts --provenance --tag "$DIST_TAG"

      - name: GitHub release
        if: needs.build.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ needs.build.outputs.name }}
          PKG_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$PKG_NAME $PKG_VERSION" --generate-notes --verify-tag || echo "release уже существует"
