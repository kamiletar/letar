# GlitchTip — self-hosted трекинг ошибок (PLAN-INFRA.md §70).
# Секреты — в соседнем .env (не в git, см. .gitignore infra/*/.env).
#
# Версия 6 объединяет web+worker в SERVER_ROLE: all_in_one — отдельный celery-контейнер
# не нужен при нашей нагрузке (одно приложение на старте). Масштабирование на отдельный worker —
# смена SERVER_ROLE и добавление сервиса, без миграции данных.

x-environment: &default-environment
  DATABASE_URL: postgres://glitchtip:${DB_PASSWORD}@postgres:5432/glitchtip
  VALKEY_URL: redis://valkey:6379
  SECRET_KEY: ${SECRET_KEY}
  EMAIL_URL: consolemail:// # писем нет — вывод в лог контейнера. Подключить SMTP Maddy — отдельная задача
  GLITCHTIP_DOMAIN: https://errors.s3.letar.best
  DEFAULT_FROM_EMAIL: noreply@letar.best
  ENABLE_ADMIN: 'False'
  ENABLE_OPENAPI: 'False'

services:
  postgres:
    image: postgres:18-alpine
    container_name: glitchtip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # postgres:18+ поменял конвенцию: точка монтирования — /var/lib/postgresql целиком (данные
    # кладутся в версионированный подкаталог сами), а не /var/lib/postgresql/data как раньше —
    # со старым путём контейнер падает с "PostgreSQL data in ... (unused mount/volume)".
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glitchtip -d glitchtip']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9-alpine
    container_name: glitchtip-valkey
    restart: unless-stopped

  web:
    image: glitchtip/glitchtip:6
    container_name: glitchtip-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      <<: *default-environment
      SERVER_ROLE: all_in_one
    networks:
      - default
      - traefik-network
    labels:
      # ⚠️ NPM на s3 больше не существует (проверено 2026-08-10: ни контейнера, ни занятых
      # 80/443 за ним — Traefik держит оба порта сам, с настоящим wildcard `*.s3.letar.best` по
      # DNS-01). infra/traefik/README.md и infra/nginx-proxy-manager/README.md на момент этой
      # правки всё ещё описывают «пилот, NPM держит 80/443» — устарели, миграция на боевые порты
      # прошла 2026-08-08 (см. traefik.yml, комментарий про advertisedPort), доки не обновили.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.glitchtip.rule: 'Host(`errors.s3.letar.best`)'
      traefik.http.routers.glitchtip.entrypoints: 'websecure'
      traefik.http.routers.glitchtip.tls: 'true'
      traefik.http.services.glitchtip.loadbalancer.server.port: '8000'
    volumes:
      - glitchtip_uploads:/code/uploads
    healthcheck:
      # В образе glitchtip/glitchtip нет wget/curl (только python3) — паттерн studio-staging-app
      # (wget --spider) здесь не работает молча: контейнер уходит в unhealthy без единой строки
      # в логах, потому что сам сервис поднялся штатно, просто healthcheck-команда не находится.
      test: ['CMD', 'python3', '-c', 'import urllib.request as u; u.urlopen("http://localhost:8000/")']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  glitchtip_pg_data:
  glitchtip_uploads:

networks:
  traefik-network:
    external: true
