# Дашборд Traefik — динамическая конфигурация (PLAN-INFRA.md §48)
#
# Дашборд read-only: показывает роутеры, сервисы, middleware и состояние healthcheck.
# Завести хост через него НЕЛЬЗЯ — маршруты описываются label'ами в compose приложения.
#
# ⚠️ Файл с парой логин/хеш (`auth/dashboard-users`) в git НЕ хранится, он создаётся
# на сервере — см. README, раздел «Дашборд». Пароль генерировать только инструментом
# (`openssl rand`), не придумывать руками.

http:
  routers:
    dashboard:
      rule: 'Host(`traefik.s3.letar.best`)'
      entryPoints:
        - websecure
      service: 'api@internal'
      middlewares:
        - dashboard-auth
      # ⚠️ `domains` обязателен, и это ГЛАВНОЕ здесь.
      #
      # Опасно не само наличие `certResolver`, а его наличие БЕЗ `domains`: тогда роутер
      # заказывает сертификат ровно на своё правило Host — на `traefik.s3.letar.best`.
      # Провайдер acme-dns не найдёт в хранилище ключа под это точечное имя (там только
      # `s3.letar.best`), полезет регистрировать новый аккаунт и получит `404` — регистрация
      # закрыта, и правильно закрыта.
      #
      # Пустой `tls: {}` в расчёте на наследование `entryPoints.websecure.http.tls.domains`
      # из traefik.yml — НЕ работает: проверено вживую 2026-08-07, Traefik не заказал
      # wildcard ни при старте, ни по реальному TLS-handshake с нужным SNI (отдавал
      # self-signed по умолчанию, в логе — ни одной попытки ACME).
      #
      # ⚠️ Этот роутер — единственный заказчик wildcard на s3. Роутеры приложений его только
      # используют (`tls: 'true'`, без своего резолвера). Удалить дашборд, не перенеся
      # `domains` на другой роутер, — значит остановить продление сертификата всех
      # staging-доменов. См. README, раздел «Как подключить приложение».
      tls:
        certResolver: dns
        domains:
          - main: 's3.letar.best'
            sans:
              - '*.s3.letar.best'

  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: '/etc/traefik/auth/dashboard-users'
        removeHeader: true
