# Дашборд Traefik — динамическая конфигурация (PLAN-INFRA.md §48)
#
# Дашборд read-only: показывает роутеры, сервисы, middleware и состояние healthcheck.
# Завести хост через него НЕЛЬЗЯ — маршруты описываются label'ами в compose приложения.
#
# ⚠️ Файл с парой логин/хеш (`auth/dashboard-users`) в git НЕ хранится, он создаётся
# на сервере — см. README, раздел «Дашборд». Пароль генерировать только инструментом
# (`openssl rand`), не придумывать руками.

http:
  routers:
    dashboard:
      rule: 'Host(`traefik.s3.letar.best`)'
      entryPoints:
        - websecure
      service: 'api@internal'
      middlewares:
        - dashboard-auth
      # ⚠️ `tls: {}` — ПУСТОЙ, без `certResolver`. Это не небрежность.
      #
      # Роутер с явным `certResolver: dns` и без `domains:` заказывает отдельный сертификат
      # ровно на своё правило Host — здесь на `traefik.s3.letar.best`. Провайдер acme-dns не
      # найдёт в хранилище ключа под это точечное имя (там только `s3.letar.best`), полезет
      # регистрировать новый аккаунт и получит `404` — регистрация закрыта, и правильно закрыта.
      #
      # Пустой `tls` наследует настройки entrypoint'а `websecure` из traefik.yml, где уже задан
      # `certResolver: dns` + `domains: s3.letar.best` / `*.s3.letar.best`. Wildcard домен
      # покрывает, второй сертификат не нужен вовсе.
      tls: {}

  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: '/etc/traefik/auth/dashboard-users'
        removeHeader: true
