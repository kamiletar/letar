# pin1.s3.letar.best — API очереди пиннинга (PLAN-INFRA.md §48 M2, §60, §61)
#
# Заменяет `ipfsstor4.letar.best` в NPM. Переименование не косметическое: старое имя читалось
# как «хранилище IPFS» и дважды за одну сессию ввело в заблуждение — на деле через этот вход
# контент не ходит вообще. У сервиса три ручки: `POST/DELETE /api/pin`, `GET /api/status`,
# `GET /health`. Это пульт очереди, не раздача.
#
# ⛔ РАЗДАЧА ЗДЕСЬ НИ ПРИ ЧЁМ и через Traefik не идёт. Она живёт на swarm libp2p
# (`4001/tcp+udp`, `43001` у пиннера) и на HTTP-шлюзе Kubo (`ipfs.letar.best`). Закрытие или
# поломка этого роутера раздачу не затрагивает; обратное тоже верно.
#
# Почему file-провайдер, а не label'ы: `animatrona-pin-queue` поднят с `network_mode: host`, в
# сеть `traefik-network` не входит, и его compose лежит вне git (`/opt/pin-queue` на s3, §60).
# Прицепить к нему docker-метки нельзя ни физически, ни через репозиторий.

http:
  routers:
    pin1:
      rule: 'Host(`pin1.s3.letar.best`)'
      entryPoints:
        - websecure
      service: pin1
      middlewares:
        - pin1-allowlist
      # Без `certResolver` — имя покрыто уже выпущенным wildcard `*.s3.letar.best`.
      # Ради этого поддомен и выбран под `.s3.`: собственное имя вида `pin1.letar.best`
      # потребовало бы отдельного аккаунта acme-dns, как `media.letar.best` (§48 M2).
      tls: true

  services:
    pin1:
      loadBalancer:
        servers:
          # `host.docker.internal` вместо конкретного адреса моста: сервис слушает на ХОСТЕ
          # (`network_mode: host`), а адрес docker-моста у каждой сети свой — NPM ходил через
          # `172.19.0.1`, у Traefik сеть другая. Имя резолвится через `extra_hosts` в
          # docker-compose.yml рядом.
          #
          # ⚠️ Отсюда следует ограничение, о котором легко забыть: сервис ОБЯЗАН слушать не
          # только `127.0.0.1`. Правка `BIND_ADDR=127.0.0.1` (коммит `74a246ed`, до прода так и
          # не доехала) этот маршрут сломает — прокси в контейнере, для него loopback хоста
          # недоступен. Нужен либо адрес моста, либо `0.0.0.0`. Тот же класс, что уже ломал
          # `ipfsstor4` при первой попытке закрыть порт правилом firewall.
          - url: 'http://host.docker.internal:42080'

  middlewares:
    pin1-allowlist:
      # Единственный законный вызывающий — `animatrona-tracker` на s2 (решение владельца
      # 2026-08-08: «пинить может только трекер»). Десктопное приложение сюда не ходит: его
      # клиент удалён (`563f9fb1`) вместе с зашитым в него токеном.
      #
      # ⛔ ЗАГЛУШКА, НЕ БОЕВОЕ ЗНАЧЕНИЕ. `0.0.0.0/32` не совпадает ни с одним адресом, то есть
      # маршрут по умолчанию закрыт для всех. Это намеренно: пустить сюда «пока всех» на время
      # настройки — ровно тот способ, которым временное становится постоянным. Подставить
      # публичный IP s2 перед вводом в работу.
      ipAllowList:
        sourceRange:
          - '0.0.0.0/32'
