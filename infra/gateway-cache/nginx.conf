# Кеширующий прокси перед IPFS-шлюзом — PLAN-INFRA.md §57.
#
# Задача не «ускорить раздачу IPFS» вообще, а конкретная: ускорить время до первого байта для
# animatrona-tracker (постеры, JSON-манифесты, субтитры). Видео/аудио через этот кеш НЕ проходят —
# решение владельца 2026-08-07, см. §57 «Кешировать файлы меньше 5 МБ и раздача видео плохо
# совместимы». Фильтр — по Content-Type ответа, не по размеру: порог в мегабайтах пропустил бы
# короткие ролики и превью-аудио, список типов исключает video/*|audio/* по построению.

# max_size — мягкий предел (cache manager чистит периодически, между проходами возможен перебор).
# use_temp_path=off — временные файлы пишутся сразу в каталог кеша, а не отдельно копируются туда.
proxy_cache_path /var/cache/nginx/ipfs levels=1:2 keys_zone=ipfs_cache:100m max_size=10g inactive=365d use_temp_path=off;

# По Content-Type ответа решаем, класть ли объект в кеш. $upstream_http_content_type доступен на
# этой стадии — заголовки от бэкенда к моменту записи в кеш уже получены.
map $upstream_http_content_type $gateway_skip_cache {
    default            1;
    "~*application/json"  0;
    "~*^image/"            0;
    "~*text/vtt"           0;
}

server {
    listen 80;
    server_name gateway.letar.best;

    # Health check самого nginx — не проксируется, для docker healthcheck и внешней проверки.
    location = /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        # Origin — публичный IPFS-узел (s3, за Traefik, уже с валидным TLS). Адресуется по сети,
        # не через 127.0.0.1 — прокси и Kubo физически на разных серверах (§57).
        proxy_pass https://ipfs.letar.best;
        proxy_http_version 1.1;

        # CID неизменяем — контент по одному и тому же /ipfs/{cid} всегда один и тот же.
        # Инвалидация не нужна вовсе, TTL можно ставить бесконечным.
        proxy_cache ipfs_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        # Иначе первый заход на непрокешированный постер шлёт в Kubo пачку параллельных запросов
        # одного и того же объекта — ровно та нагрузка, от которой уходим.
        proxy_cache_lock on;

        proxy_no_cache $gateway_skip_cache;
        # Игнорируем заголовки кеширования от Kubo — режим решает этот конфиг, не бэкенд.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        # ⚠️ Некешируемое (видео/аудио) всё равно проходит через nginx и при ответе больше буферов
        # уходит на диск временным файлом — независимо от кеша, это отдельный механизм
        # (proxy_temp_path). На mail-сервере это опасно вдвойне: диск общий с почтой, а почта —
        # канал доставки алертов. Предел ниже не устраняет риск, только не даёт ему расти
        # неограниченно; постоянный мониторинг свободного места остаётся отдельной задачей.
        proxy_max_temp_file_size 1024m;

        add_header X-Cache-Status $upstream_cache_status always;
        # Браузерный кеш не менее важен серверного: повторный заход не должен доходить даже до
        # этого прокси. Безопасно ровно по той же причине — CID неизменяем.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
