# Кеширующий прокси перед IPFS-шлюзом — PLAN-INFRA.md §57.
#
# Задача не «ускорить раздачу IPFS» вообще, а конкретная: ускорить время до первого байта для
# animatrona-tracker (постеры, JSON-манифесты, субтитры). Видео/аудио через этот кеш НЕ проходят —
# решение владельца 2026-08-07, см. §57 «Кешировать файлы меньше 5 МБ и раздача видео плохо
# совместимы». Фильтр — по Content-Type ответа, не по размеру: порог в мегабайтах пропустил бы
# короткие ролики и превью-аудио, список типов исключает video/*|audio/* по построению.

# max_size — мягкий предел (cache manager чистит периодически, между проходами возможен перебор).
# use_temp_path=off — временные файлы пишутся сразу в каталог кеша, а не отдельно копируются туда.
proxy_cache_path /var/cache/nginx/ipfs levels=1:2 keys_zone=ipfs_cache:100m max_size=10g inactive=365d use_temp_path=off;

# По Content-Type ответа решаем, класть ли объект в кеш. $upstream_http_content_type доступен на
# этой стадии — заголовки от бэкенда к моменту записи в кеш уже получены.
map $upstream_http_content_type $gateway_skip_cache {
    default            1;
    "~*application/json"  0;
    "~*^image/"            0;
    "~*text/vtt"           0;
}

server {
    listen 80;
    server_name gateway.letar.best;

    # Health check самого nginx — не проксируется, для docker healthcheck и внешней проверки.
    location = /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        # Access-control по Referer — слабая защита от прямого расшаривания ссылки (как и в
        # infra/media-server/nginx.conf), не полноценная авторизация. Список доменов подставляется
        # envsubst'ом официального docker-entrypoint из переменной окружения GATEWAY_VALID_REFERERS
        # (реальный `.env` — НЕ коммитится, см. .gitignore `infra/*/.env` + `.env.example` рядом):
        # единственный текущий потребитель — animatrona-tracker на *.letar.best, сам letar.best не
        # коммерческий домен клиента и не подпадает под запрет public-repo-hygiene.md, но механизм
        # сделан расширяемым на случай, если завтра потребителем станет клиентский домен — его
        # тогда добавляют только в `.env` на сервере, никогда в git (тот же класс нарушения уже
        # был в infra/media-server/nginx.conf).
        #
        # ⚠️ Здесь ИМЕННО ЛИТЕРАЛЬНАЯ строка в этом файле (не `include` отдельного файла) —
        # `valid_referers` через `include` ломает парсер nginx :alpine 1.31 ("directive is not
        # allowed here" на include'нутом файле, хотя тот же include с `add_header` работает и
        # прямое объявление в этом же файле работает) — воспроизведено и подтверждено 2026-09-08,
        # похоже на квирк модуля `ngx_http_referer_module` с контекстом при парсинге через
        # отдельный `include`. Из-за файла, который заведомо не в git, это не критично: единственный
        # некоммитящийся кусок — значение `${GATEWAY_VALID_REFERERS}`, а не сама директива.
        #
        # Этот файл — шаблон `default.conf.template` для envsubst (см. docker-compose.yml,
        # `/etc/nginx/templates/`), не статический `conf.d/default.conf` напрямую.
        #
        # Проверка стоит ДО proxy_cache (по фазам nginx — access/rewrite раньше content/cache,
        # return завершает обработку немедленно), и Referer не входит в proxy_cache_key ниже —
        # иначе кеш размазался бы по числу источников одного и того же CID.
        valid_referers none blocked ${GATEWAY_VALID_REFERERS};
        if ($invalid_referer) {
            return 403;
        }

        # Origin — публичный IPFS-узел (s3, за Traefik, уже с валидным TLS). Адресуется по сети,
        # не через 127.0.0.1 — прокси и Kubo физически на разных серверах (§57).
        proxy_pass https://ipfs.letar.best;
        proxy_http_version 1.1;

        # CID неизменяем — контент по одному и тому же /ipfs/{cid} всегда один и тот же.
        # Инвалидация не нужна вовсе, TTL можно ставить бесконечным.
        proxy_cache ipfs_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        # Иначе первый заход на непрокешированный постер шлёт в Kubo пачку параллельных запросов
        # одного и того же объекта — ровно та нагрузка, от которой уходим.
        proxy_cache_lock on;

        proxy_no_cache $gateway_skip_cache;
        # Игнорируем заголовки кеширования от Kubo для ПРИНЯТИЯ РЕШЕНИЯ о кешировании — режим
        # решает этот конфиг, не бэкенд. ⚠️ `proxy_ignore_headers` сам по себе НЕ убирает заголовок
        # из ответа клиенту — только не даёт nginx на него ориентироваться внутри себя. Без
        # `proxy_hide_header` ниже клиент получал бы ДВА заголовка `Cache-Control` разом (свой из
        # `add_header` ниже + пришедший от Kubo, `public, max-age=29030400, immutable`) —
        # обнаружено вживую 2026-09-08 при проверке access-control на реальном постере.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;

        # ⚠️ Некешируемое (видео/аудио) всё равно проходит через nginx. Раньше здесь стоял предел
        # 1024m — он ограничивал рост временного файла, но не устранял сам факт записи на диск.
        # 0 отключает запись переполнения буфера во временный файл ВООБЩЕ (офиц. документация
        # nginx: "The zero value disables buffering of responses to temporary files") — при
        # нехватке proxy_buffers/proxy_buffer_size nginx придерживает чтение от апстрима, ожидая,
        # когда клиент заберёт уже забуференное, а не льёт лишнее на диск. На mail-сервере это
        # не компромисс, а необходимость: диск общий с почтой (Maddy), а почта — канал доставки
        # алертов о самой же проблеме места на диске. Живой замер после включения — README
        # § «Мониторинг диска».
        proxy_max_temp_file_size 0;

        add_header X-Cache-Status $upstream_cache_status always;
        # Браузерный кеш не менее важен серверного: повторный заход не должен доходить даже до
        # этого прокси. Безопасно ровно по той же причине — CID неизменяем.
        #
        # ⚠️ БЕЗ `always` — намеренно, найдено вживую 2026-09-08 при тесте access-control (DoD
        # §57): с `always` этот заголовок навешивался и на `403` от `valid_referers`/`if` выше,
        # то есть браузер мог закешировать отказ доступа как immutable на год. Без `always`
        # add_header по умолчанию не применяется к 4xx/5xx (список кодов — только 2xx/3xx-редиректы),
        # что и нужно: кешировать бессрочно должен только реально отданный файл.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
