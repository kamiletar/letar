# acme-dns — конфигурация (PLAN-INFRA.md §48)
#
# ⚠️ IP в секции records должен совпадать с реальным адресом сервера, где поднят
#    контейнер, и с A-записью `acme` в зоне letar.best. Расхождение = делегирование
#    не работает, а диагностируется это неприятно (NXDOMAIN без внятной причины).

[general]
listen = "0.0.0.0:53"
protocol = "both"
domain = "acme.letar.best"
nsname = "acme.letar.best"
nsadmin = "admin.letar.best"

# Записи, которые acme-dns отдаёт для собственной зоны. Self-delegation по README:
# NS указывает на сам себя, A в родительской зоне работает как glue.
records = [
    "acme.letar.best. A 185.28.85.195",
    "acme.letar.best. NS acme.letar.best.",
]

debug = false

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "80"
tls = "none"

# ⚠️ После регистрации нашего единственного аккаунта переключить на true и
# передеплоить. Иначе любой, кто дотянется до API, заведёт себе поддомен.
disable_registration = false

corsorigins = ["*"]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
