# acme-dns — конфигурация (PLAN-INFRA.md §48)
#
# ⚠️ IP в секции records должен совпадать с реальным адресом сервера, где поднят
#    контейнер, и с A-записью `acme` в зоне letar.best. Расхождение = делегирование
#    не работает, а диагностируется это неприятно (NXDOMAIN без внятной причины).

[general]
listen = "0.0.0.0:53"
protocol = "both"
domain = "acme.letar.best"
nsname = "ns-acme.letar.best"
nsadmin = "admin.letar.best"

# ⚠️ Имя сервера имён (`ns-acme`) НЕ совпадает с делегируемой зоной (`acme`) намеренно.
# Схема self-delegation из README acme-dns (A и NS на одном имени) не проходит: панель
# Dynadot отвечает «Невозможно устанавливать NS-запись и A-запись одновременно для одного
# поддомена». Разнесение по двум именам решает это и заодно снимает нужду в glue — `ns-acme`
# резолвится из родительской зоны letar.best как обычная A-запись.
records = [
    "acme.letar.best. NS ns-acme.letar.best.",
    "ns-acme.letar.best. A 185.28.85.195",
]

debug = false

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "80"
tls = "none"

# Временно открыто 2026-08-25 для регистрации 6 acme-dns аккаунтов под собственные домены
# приложений (§48 M3 шаг 2, PLAN-INFRA-2.md) — закрыть обратно сразу после регистрации,
# не оставлять окно открытым дольше необходимого.
disable_registration = false

corsorigins = ["*"]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
