services:
  media-api:
    build: .
    image: media-server:latest
    container_name: media-api
    ports:
      - '3100:3100'
    environment:
      PORT: ${PORT}
      PUBLIC_URL: ${PUBLIC_URL}
      REDIS_URL: ${REDIS_URL}
      DATA_PATH: ${DATA_PATH}
      MEDIA_KEY_SVOICHUZHIE: ${MEDIA_KEY_SVOICHUZHIE}
      MEDIA_KEY_ANIMATRONA: ${MEDIA_KEY_ANIMATRONA}
    volumes:
      - /data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kami-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  media-worker:
    image: media-server:latest
    container_name: media-worker
    command: bun run src/worker.ts
    environment:
      REDIS_URL: ${REDIS_URL}
      DATA_PATH: ${DATA_PATH}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - /data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kami-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: media-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - kami-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: media-nginx
    ports:
      # Публикация на хост оставлена намеренно: через неё ходит NPM, и это путь отката,
      # пока NPM на s3 не остановлен (PLAN-INFRA.md §48 M2).
      - '3101:80'
    volumes:
      - /data/processed:/data/processed:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kami-network
      - traefik-network
    labels:
      # Маршрут описан здесь, а не в SQLite внутри NPM (PLAN-INFRA.md §48).
      #
      # Всё содержательное — HTTP Range, иммутабельный кэш, CORP/CORS, защита от хотлинкинга —
      # живёт в ./nginx.conf ВНУТРИ этого контейнера, а не в конфиге прокси. NPM здесь работает
      # тупым пробрасывателем на :3101, поэтому смена прокси эту логику не задевает вообще.
      # Загрузка видео через прокси не ходит вовсе — она идёт в media-api на другой порт.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.media.rule: 'Host(`media.letar.best`)'
      traefik.http.routers.media.entrypoints: 'websecure'
      # ⚠️ ЕДИНСТВЕННЫЙ роутер на s3 со своим `certresolver` — и это не отступление от правила
      # «приложениям резолвер не нужен», а другой случай.
      #
      # `media.letar.best` лежит ВНЕ `*.s3.letar.best`, поэтому взять готовый сертификат из
      # хранилища ему неоткуда — в отличие от staging-доменов, которые все покрыты wildcard'ом.
      # Ключ зоны `letar.best` на s3 не кладут сознательно: иначе компрометация staging-сервера
      # давала бы валидный сертификат на весь продакшен-домен (infra/traefik/README.md).
      #
      # Решение владельца 2026-08-08 — отдельный аккаунт acme-dns ровно на это одно имя
      # (PLAN-INFRA.md §48 M2, вариант 1). Худший случай сжимается с «вся зона» до «одно имя».
      #
      # ⛔ Без `domains` — НАМЕРЕННО, и это ровно обратное тому, что нужно дашборду.
      # Правило одно и то же: имя, на которое заказывается сертификат, обязано СОВПАДАТЬ с
      # ключом в `acme-dns-accounts.json`. Поиск там точный, без подъёма по иерархии — доказано
      # нашим же провалом на дашборде (`traefik.s3.letar.best` не нашёл ключ `s3.letar.best` и
      # получил 404). Здесь Host и ключ совпадают буквально, поэтому подменять имя через
      # `domains` не нужно.
      #
      # ⚠️ Две предпосылки живут ВНЕ git, и без любой из них будет тот самый 404:
      #   1. ключ `media.letar.best` в `/home/deploy/lego/acme-dns-accounts.json` на s3;
      #   2. `CNAME _acme-challenge.media.letar.best` → `<fulldomain>` у регистратора.
      # Порядок и команды — infra/acme-dns/README.md, «Аккаунт на одно имя».
      traefik.http.routers.media.tls: 'true'
      traefik.http.routers.media.tls.certresolver: 'dns'
      # Порт КОНТЕЙНЕРА, не хостовый
      traefik.http.services.media.loadbalancer.server.port: '80'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  kami-network:
    external: true
  # Traefik маршрутизирует только контейнеры в своей сети: docker-провайдер читает label'ы
  # контейнеров, а не адреса. Сеть создаётся один раз на сервере (docker network create).
  traefik-network:
    external: true
