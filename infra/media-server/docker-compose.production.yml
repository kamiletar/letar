# Медиа-сервер (PLAN-INFRA.md §48 M2) — боевая раздача и заливка видео.
#
# ⛔ ПОДНИМАТЬ ТОЛЬКО С `--env-file`:
#
#     docker compose -f docker-compose.production.yml --env-file .env.docker up -d
#
# Без флага compose подставит в `environment:` ниже ПУСТЫЕ СТРОКИ и предупредит об этом одной
# строкой «Defaulting to a blank string» на каждую переменную — но команда завершится успешно, а
# контейнеры поднимутся и будут выглядеть здоровыми. `media-api` при этом останется без
# `MEDIA_KEY_*`, то есть без ключей, которыми подписываются запросы приложений.
#
# ⚠️ Наступили на это 2026-08-08: команда без флага была выдана в задании (мной же, root-weaver),
# исполнитель заметил пустые переменные в выводе и передеплоил правильно за секунды. Ловушка
# коварна тем, что `--env-file` нужен здесь не для интерполяции путей или портов, а для секретов —
# и её отсутствие не ломает старт, а тихо обнуляет авторизацию.
#
# Отдельная деталь на будущее: `nginx` и `redis` переменных не читают, поэтому при ошибочном
# запуске compose пересоздаёт только `media-api`/`media-worker` — раздача `/v/` продолжает
# работать, и внешняя проверка «видео играет» ничего не заметит.

services:
  media-api:
    build: .
    image: media-server:latest
    container_name: media-api
    ports:
      - '3100:3100'
    environment:
      PORT: ${PORT}
      PUBLIC_URL: ${PUBLIC_URL}
      REDIS_URL: ${REDIS_URL}
      DATA_PATH: ${DATA_PATH}
      MEDIA_KEY_SVOICHUZHIE: ${MEDIA_KEY_SVOICHUZHIE}
      MEDIA_KEY_ANIMATRONA: ${MEDIA_KEY_ANIMATRONA}
    volumes:
      - /data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kami-network
      - traefik-network
    labels:
      # ⚠️ Корневой маршрут `media.letar.best` — СЮДА, в API, а не в nginx.
      #
      # У этого имени два backend'а, и это выяснилось только из живого `.conf` NPM (2026-08-08):
      # `location /` → `:3100` (этот сервис), `location /v/` → `:3101` (media-nginx). Раньше в
      # плане было записано обратное — «загрузка через прокси не ходит вовсе». Неверно: ходит,
      # именно через корневой location, отсюда и `client_max_body_size 20g` в конфиге NPM.
      #
      # Разметить только раздачу означало бы 404 на всём, что не под `/v/`: у media-nginx нет
      # `location /` вообще (см. nginx.conf рядом), он отдаёт только `/v/` и `/nginx-health`.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.media-api.rule: 'Host(`media.letar.best`)'
      traefik.http.routers.media-api.entrypoints: 'websecure'
      # Приоритет проставлен явно, хотя по длине правила `media-v` победил бы и так. Полагаться
      # на неявную длину здесь нельзя: любое удлинение этого правила молча перевернуло бы порядок,
      # и загрузка начала бы уходить в раздачу.
      traefik.http.routers.media-api.priority: '10'
      # Заказчик сертификата — этот роутер (второй берёт готовый из хранилища), см. длинный
      # комментарий у сервиса nginx ниже.
      traefik.http.routers.media-api.tls: 'true'
      traefik.http.routers.media-api.tls.certresolver: 'dns'
      traefik.http.services.media-api.loadbalancer.server.port: '3100'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  media-worker:
    image: media-server:latest
    container_name: media-worker
    command: bun run src/worker.ts
    environment:
      REDIS_URL: ${REDIS_URL}
      DATA_PATH: ${DATA_PATH}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - /data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kami-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: media-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - kami-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: media-nginx
    ports:
      # Публикация на хост оставлена намеренно: через неё ходит NPM, и это путь отката,
      # пока NPM на s3 не остановлен (PLAN-INFRA.md §48 M2).
      - '3101:80'
    volumes:
      - /data/processed:/data/processed:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kami-network
      - traefik-network
    labels:
      # Маршрут описан здесь, а не в SQLite внутри NPM (PLAN-INFRA.md §48).
      #
      # Раздача — только `/v/`. Всё содержательное (HTTP Range, иммутабельный кэш, CORP/CORS,
      # защита от хотлинкинга) живёт в ./nginx.conf ВНУТРИ этого контейнера. NPM дублировал
      # CORS-заголовки поверх ответа сверху; после переезда дубли пропадут, останется по одному
      # экземпляру — то есть станет строго корректнее, а не хуже.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.media-v.rule: 'Host(`media.letar.best`) && PathPrefix(`/v/`)'
      traefik.http.routers.media-v.entrypoints: 'websecure'
      traefik.http.routers.media-v.priority: '20'
      # ⚠️ ЕДИНСТВЕННЫЙ роутер на s3 со своим `certresolver` — и это не отступление от правила
      # «приложениям резолвер не нужен», а другой случай.
      #
      # `media.letar.best` лежит ВНЕ `*.s3.letar.best`, поэтому взять готовый сертификат из
      # хранилища ему неоткуда — в отличие от staging-доменов, которые все покрыты wildcard'ом.
      # Ключ зоны `letar.best` на s3 не кладут сознательно: иначе компрометация staging-сервера
      # давала бы валидный сертификат на весь продакшен-домен (infra/traefik/README.md).
      #
      # Решение владельца 2026-08-08 — отдельный аккаунт acme-dns ровно на это одно имя
      # (PLAN-INFRA.md §48 M2, вариант 1). Худший случай сжимается с «вся зона» до «одно имя».
      #
      # ⛔ Без `domains` — НАМЕРЕННО, и это ровно обратное тому, что нужно дашборду.
      # Правило одно и то же: имя, на которое заказывается сертификат, обязано СОВПАДАТЬ с
      # ключом в `acme-dns-accounts.json`. Поиск там точный, без подъёма по иерархии — доказано
      # нашим же провалом на дашборде (`traefik.s3.letar.best` не нашёл ключ `s3.letar.best` и
      # получил 404). Здесь Host и ключ совпадают буквально, поэтому подменять имя через
      # `domains` не нужно.
      #
      # ⚠️ Две предпосылки живут ВНЕ git, и без любой из них будет тот самый 404:
      #   1. ключ `media.letar.best` в `/home/deploy/lego/acme-dns-accounts.json` на s3;
      #   2. `CNAME _acme-challenge.media.letar.best` → `<fulldomain>` у регистратора.
      # Порядок и команды — infra/acme-dns/README.md, «Аккаунт на одно имя».
      #
      # Сам `certresolver` стоит на роутере `media-api` (сервис выше) — заказчик нужен один,
      # второй роутер берёт уже выпущенный сертификат из хранилища по совпадению имени.
      traefik.http.routers.media-v.tls: 'true'
      # Порт КОНТЕЙНЕРА, не хостовый
      traefik.http.services.media-v.loadbalancer.server.port: '80'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  kami-network:
    external: true
  # Traefik маршрутизирует только контейнеры в своей сети: docker-провайдер читает label'ы
  # контейнеров, а не адреса. Сеть создаётся один раз на сервере (docker network create).
  traefik-network:
    external: true
