server {
    listen 80;
    server_name _;

    location /v/ {
        alias /data/processed/;

        # HTTP Range обязателен для перемотки видео в браузере
        add_header Accept-Ranges bytes always;

        # Иммутабельный кэш — URL содержит videoId (cuid2)
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # CORP/CORS — без этого браузер блокирует cross-origin media через ORB
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        # Защита от хотлинкинга (кириллические домены через punycode: направа.рф = xn--e1afmkfd.xn--p1acf)
        valid_referers none blocked *.letar.best *.neyroaboi.ru *.svoichuzhie.ru ~\.xn--e1afmkfd\.xn--p1acf$;
        if ($invalid_referer) {
            return 403;
        }
    }

    # Health check nginx
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
