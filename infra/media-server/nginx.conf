server {
    listen 80;
    server_name _;

    location /v/ {
        alias /data/processed/;

        # HTTP Range обязателен для перемотки видео в браузере
        add_header Accept-Ranges bytes always;

        # Иммутабельный кэш — URL содержит videoId (cuid2)
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Защита от хотлинкинга
        valid_referers none blocked ~\.(letar\.best|neyroaboi\.ru|направа\.рф|svoichuzhie\.ru)$;
        if ($invalid_referer) {
            return 403;
        }
    }

    # Health check nginx
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
