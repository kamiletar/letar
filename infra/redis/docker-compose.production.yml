services:
  redis:
    image: redis:7-alpine
    container_name: letar-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # ⚠️ Порт НЕ публикуется на хост намеренно (см. .claude/docs/redis-security.md).
    # Потребители подключаются только через docker-сеть kami-network по имени контейнера.
    networks:
      - kami-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local

networks:
  kami-network:
    external: true
