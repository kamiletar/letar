name: form-docs-staging

services:
  app:
    image: form-docs:staging
    container_name: form-docs-staging-app
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE}
      NEXT_PUBLIC_GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE}
      TZ: Europe/Moscow
      NODE_ENV: production
      # Внутренний PORT=3020 — из Dockerfile.production, тот же образ что и прод. Без БД и без
      # auth (form-docs — статическая документация).
      PORT: '3020'
      # Umami Analytics — тот же публичный счётчик, что и прод (не приватные данные)
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    ports:
      # Хостовый 3035 — следующий свободный после domwellbes-staging(3031)/studio-staging(3032)/
      # form-example-staging(3033)/kami-staging(3034). Подтвердить перед первым деплоем.
      #
      # Публикация на хост оставлена намеренно, хотя маршрут уже идёт через Traefik: через неё
      # ходит NPM, и это путь отката пилота (PLAN-INFRA.md §48 M1b). Убрать — после M2.
      - '3035:3020'
    networks:
      - default
      - traefik-network
    labels:
      # Маршрут описан здесь, а не в SQLite внутри NPM, — ради этого и затевался §48.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.form-docs-stage.rule: 'Host(`form-docs-stage.s1.letar.best`)'
      traefik.http.routers.form-docs-stage.entrypoints: 'websecure'
      # ⛔ Без `certresolver` — сертификат уже выпущен (wildcard `*.s1.letar.best`), роутер его
      # только использует. Свой резолвер здесь заказал бы точечный сертификат на это имя и
      # упёрся бы в закрытую регистрацию acme-dns (`404`). Разбор — infra/traefik/README.md.
      traefik.http.routers.form-docs-stage.tls: 'true'
      # Порт КОНТЕЙНЕРА, не хостовый: Traefik ходит напрямую по сети traefik-network
      traefik.http.services.form-docs-stage.loadbalancer.server.port: '3020'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3020/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

networks:
  # Traefik маршрутизирует только контейнеры в своей сети: docker-провайдер читает label'ы
  # контейнеров, а не адреса. Сеть создаётся один раз на сервере (docker network create).
  traefik-network:
    external: true
