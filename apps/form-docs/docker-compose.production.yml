services:
  # Rollout-профиль (§18.6, тираж после пилота time): нет container_name/ports (zero-downtime
  # требует scale=2), network alias вместо голого имени сети (сохраняет NPM Forward Host
  # 'form-docs-app' без изменений, если он уже так настроен), healthcheck (стандарт grandslamcup/
  # time), image через DEPLOY_TAG (rollback без пересборки). Label letar.rollout ПОКА
  # закомментирован — раскомментировать только после обычного (не-rollout) деплоя, который
  # подтвердит, что снятие публикации хост-порта 3020 не ломает NPM-роутинг для этого приложения
  # (в отличие от time, у form-docs порт был реально опубликован, а не просто задан для памяти).
  app:
    image: form-docs:${DEPLOY_TAG:-latest}
    restart: always
    environment:
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production

      # Umami Analytics
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3020/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    # labels:
    #   letar.rollout: 'true'
    networks:
      premium-network:
        aliases:
          - form-docs-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  premium-network:
    external: true
