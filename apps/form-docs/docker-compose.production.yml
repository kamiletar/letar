services:
  # Rollout-профиль (§18.6, тираж после пилота time): нет container_name/ports (zero-downtime
  # требует scale=2), network alias вместо голого имени сети (сохраняет NPM Forward Host
  # 'form-docs-app' — подтверждено обычным деплоем 2026-07-12, снятие host-port publish не
  # ломает роутинг), healthcheck (стандарт grandslamcup/time), image через DEPLOY_TAG. Label
  # letar.rollout включён для supervised-пилота (сессия SwiftCastle, после подтверждающего
  # обычного деплоя commit 4fbc414).
  app:
    image: form-docs:${DEPLOY_TAG:-latest}
    restart: always
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production

      # Umami Analytics
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3020/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
      # §48 M3 шаг 5, пачка 2 — регистрация Traefik docker-provider роутера. Только регистрация,
      # трафик НЕ переключён (NPM продолжает форвардить напрямую на form-docs-app:3020), см.
      # PLAN-INFRA-2.md §48 M3.
      traefik.enable: 'true'
      traefik.docker.network: 'kami-network'
      traefik.http.routers.form-docs.rule: 'Host(`forms.letar.best`)'
      traefik.http.routers.form-docs.entrypoints: 'websecure'
      traefik.http.routers.form-docs.tls.certresolver: 'dns'
      traefik.http.routers.form-docs.tls.domains[0].main: 'letar.best'
      traefik.http.routers.form-docs.tls.domains[0].sans[0]: '*.letar.best'
      traefik.http.services.form-docs.loadbalancer.server.port: '3020'
    networks:
      kami-network:
        aliases:
          - form-docs-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
