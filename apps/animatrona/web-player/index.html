<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animatrona Web Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <h1 class="title" id="anime-title">Loading...</h1>
        <div class="header-info">
          <span id="anime-year"></span>
        </div>
      </header>

      <!-- Main content -->
      <main class="main">
        <!-- Video container -->
        <div class="player-container">
          <div class="video-wrapper" id="video-wrapper">
            <video id="video" playsinline></video>
            <audio id="audio" style="display: none"></audio>

            <!-- Subtitle overlay -->
            <div id="subtitle-overlay" class="subtitle-overlay"></div>

            <!-- Controls overlay -->
            <div class="controls-overlay" id="controls">
              <div class="controls-top">
                <span class="episode-title" id="episode-title"></span>
              </div>

              <div class="controls-center">
                <button class="btn-icon btn-play" id="btn-play">
                  <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                  <svg class="icon-pause" viewBox="0 0 24 24">
                    <rect x="6" y="4" width="4" height="16" />
                    <rect x="14" y="4" width="4" height="16" />
                  </svg>
                </button>
              </div>

              <div class="controls-bottom">
                <div class="progress-container">
                  <div class="progress-bar" id="progress-bar">
                    <div class="progress-played" id="progress-played"></div>
                    <div class="progress-buffered" id="progress-buffered"></div>
                  </div>
                </div>

                <div class="controls-row">
                  <div class="controls-left">
                    <button class="btn-icon" id="btn-rewind">
                      <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" /></svg>
                    </button>
                    <button class="btn-icon" id="btn-forward">
                      <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" /></svg>
                    </button>
                    <span class="time-display">
                      <span id="time-current">0:00</span>
                      <span>/</span>
                      <span id="time-duration">0:00</span>
                    </span>
                  </div>

                  <div class="controls-right">
                    <div class="volume-control">
                      <button class="btn-icon" id="btn-mute">
                        <svg class="icon-volume" viewBox="0 0 24 24">
                          <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
                          />
                        </svg>
                        <svg class="icon-muted" viewBox="0 0 24 24">
                          <path
                            d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"
                          />
                        </svg>
                      </button>
                      <input
                        type="range"
                        class="volume-slider"
                        id="volume-slider"
                        min="0"
                        max="1"
                        step="0.05"
                        value="1"
                      />
                    </div>

                    <div class="dropdown" id="audio-dropdown">
                      <button class="btn-text" id="btn-audio">Audio</button>
                      <div class="dropdown-menu" id="audio-menu"></div>
                    </div>

                    <div class="dropdown" id="subtitle-dropdown">
                      <button class="btn-text" id="btn-subtitle">Subs</button>
                      <div class="dropdown-menu" id="subtitle-menu"></div>
                    </div>

                    <button class="btn-icon" id="btn-fullscreen">
                      <svg class="icon-enter" viewBox="0 0 24 24">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                      </svg>
                      <svg class="icon-exit" viewBox="0 0 24 24">
                        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Episode list sidebar -->
        <aside class="sidebar" id="sidebar">
          <h2 class="sidebar-title">Episodes</h2>
          <div class="episode-list" id="episode-list"></div>
        </aside>
      </main>
    </div>

    <script src="player.js"></script>
  </body>
</html>
