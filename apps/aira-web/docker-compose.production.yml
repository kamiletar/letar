services:
  app:
    image: aira-web:latest
    container_name: aira-web-app
    restart: always
    ports:
      # Только loopback (§49): NPM форвардит по имени контейнера через kami-network
      # (aira.letar.best → aira-web-app:3017, проверено в data/nginx/proxy_host/19.conf).
      - '127.0.0.1:3017:3017'
    environment:
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production
      PORT: 3017
    networks:
      - kami-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
