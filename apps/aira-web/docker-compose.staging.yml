name: aira-web-staging

services:
  app:
    image: aira-web:staging
    container_name: aira-web-staging-app
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      NODE_ENV: production
      # Внутренний PORT=3017 — из Dockerfile.production, тот же образ что и прод. Без БД и без
      # auth (см. apps/aira-web/src/lib — только github.ts/seo.ts, никакого lib/auth.ts).
      PORT: '3017'
    ports:
      # Хостовый 3029 — следующий свободный после mandala(3024)/svoichuzhie(3025)/
      # aprel8008(3026)/dsperevod(3027)/pravda(3028). Подтвердить перед первым деплоем.
      #
      # Публикация на хост оставлена намеренно, хотя маршрут уже идёт через Traefik: через неё
      # ходит NPM, и это путь отката пилота (PLAN-INFRA.md §48 M1b). Убрать — после M2.
      - '3029:3017'
    networks:
      - default
      - traefik-network
    labels:
      # Маршрут описан здесь, а не в SQLite внутри NPM, — ради этого и затевался §48.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.aira-web-stage.rule: 'Host(`aira-web-stage.s3.letar.best`)'
      traefik.http.routers.aira-web-stage.entrypoints: 'websecure'
      # ⛔ Без `certresolver` — сертификат уже выпущен (wildcard `*.s3.letar.best`), роутер его
      # только использует. Свой резолвер здесь заказал бы точечный сертификат на это имя и
      # упёрся бы в закрытую регистрацию acme-dns (`404`). Разбор — infra/traefik/README.md.
      traefik.http.routers.aira-web-stage.tls: 'true'
      # Порт КОНТЕЙНЕРА, не хостовый: Traefik ходит напрямую по сети traefik-network
      traefik.http.services.aira-web-stage.loadbalancer.server.port: '3017'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3017/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

networks:
  # Traefik маршрутизирует только контейнеры в своей сети: docker-провайдер читает label'ы
  # контейнеров, а не адреса. Сеть создаётся один раз на сервере (docker network create).
  traefik-network:
    external: true
