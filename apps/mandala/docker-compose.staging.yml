name: mandala-staging

services:
  db:
    image: postgres:17-alpine
    container_name: mandala-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandala_staging
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - mandala-staging-data:/var/lib/postgresql/data
    # Хостовый порт на s3 — следующий свободный после grandslamcup(5454)/auth-hub(5455)/
    # driving-school(5456)/aboi(5457)/time(5458)/e2e-postgres(5499). Не проверялся напрямую на
    # s3 — подтвердить перед первым деплоем.
    # ⚠️ Комментарий НЕ должен стоять между `ports:` и первой записью порта — deploy-affected.sh
    # извлекает DB_PORT через `grep -A 1 "ports:"`, захватывая первую строку после `ports:`
    # буквально.
    ports:
      - '5459:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d mandala_staging']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: mandala:staging
    container_name: mandala-staging-app
    restart: unless-stopped
    ports:
      # Внутренний 3004 — из Dockerfile.production (ENV PORT=3004), тот же образ что и прод.
      # Хостовый 3024 — следующий свободный после aboi(3022)/time(3023). Подтвердить перед
      # первым деплоем.
      - '3024:3004'
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql://lena_user:${DB_PASSWORD:-postgres}@mandala-staging-db:5432/mandala_staging
      # Google/Yandex OAuth на staging сознательно не настраивается — mandala/auth.ts включает
      # соц-провайдер в конфиг только если оба AUTH_*_ID/AUTH_*_SECRET заданы (без них блок
      # просто отсутствует, email/password работает нормально).
      # ⚠️ Реальный публичный домен, не localhost — mandala/auth.ts не задаёт свой trustedOrigins,
      # Better Auth по умолчанию доверяет только Origin, совпадающему с baseURL; localhost не
      # совпадал с Origin реального e2e-браузера (найдено 2026-07-19 на aboi, тот же класс бага,
      # PLAN.md §18.7).
      BETTER_AUTH_URL: https://mandala-stage.s3.letar.best
    volumes:
      - ./uploads:/app/apps/mandala/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - traefik-network
    labels:
      # Маршрут описан здесь, а не в SQLite внутри NPM, — ради этого и затевался §48.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.mandala-stage.rule: 'Host(`mandala-stage.s3.letar.best`)'
      traefik.http.routers.mandala-stage.entrypoints: 'websecure'
      # ⛔ Без `certresolver` — сертификат уже выпущен (wildcard `*.s3.letar.best`), роутер его
      # только использует. Свой резолвер здесь заказал бы точечный сертификат на это имя и
      # упёрся бы в закрытую регистрацию acme-dns (`404`). Разбор — infra/traefik/README.md.
      traefik.http.routers.mandala-stage.tls: 'true'
      # Порт КОНТЕЙНЕРА, не хостовый: Traefik ходит напрямую по сети traefik-network
      traefik.http.services.mandala-stage.loadbalancer.server.port: '3004'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3004/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  mandala-staging-data:

networks:
  # Traefik маршрутизирует только контейнеры в своей сети: docker-провайдер читает label'ы
  # контейнеров, а не адреса. Сеть создаётся один раз на сервере (docker network create).
  traefik-network:
    external: true
