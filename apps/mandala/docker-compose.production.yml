services:
  db:
    image: postgres:17-alpine
    container_name: mandala-db
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mandala
    volumes:
      - mandala_postgres_data:/var/lib/postgresql/data
    ports:
      - '5434:5432' # Порт 5434 для mandala (5432=premium, 5433=imot)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d mandala']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kami-network

  # Rollout-профиль (§18.6 Сессия J, тираж после time/form-docs/form-example): нет
  # container_name/ports (zero-downtime требует scale=2), network alias вместо голого имени
  # сети (Forward Host в NPM уже 'mandala-app' — infra/nginx-proxy-manager/README.md), healthcheck,
  # image через DEPLOY_TAG. Label letar.rollout ПОКА закомментирован — mandala публиковала
  # host-порт (${PORT:-3004}:3004), сначала обычный деплой подтверждает NPM-роутинг.
  app:
    image: mandala:${DEPLOY_TAG:-latest}
    restart: always
    # Ограничение памяти контейнера (защита от OOM хоста)
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: ${DATABASE_URL:-postgresql://lena_user:${DB_PASSWORD}@mandala-db:5432/mandala?schema=public}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3004}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3004}

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3004}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

      # OAuth Providers (опционально)
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_YANDEX_ID: ${AUTH_YANDEX_ID}
      AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET}

      # Email (SMTP via Maddy)
      SMTP_HOST: ${SMTP_HOST:-mail.letar.best}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-noreply@letar.best}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@mandala.letar.best}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mandala}

      # Yandex Metrika
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}

      # Umami Analytics (embedded at build time, but listed for reference)
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    volumes:
      - ./uploads:/app/apps/mandala/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3004/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    # labels:
    #   letar.rollout: 'true'
    networks:
      kami-network:
        aliases:
          - mandala-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mandala_postgres_data:
    driver: local

networks:
  kami-network:
    external: true
