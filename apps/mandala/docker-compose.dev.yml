# Docker Compose для локальной разработки
# Запуск: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: mandala-postgres-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: mandala
    volumes:
      - mandala_postgres_dev:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d mandala']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  mandala_postgres_dev:
    driver: local
