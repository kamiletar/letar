services:
  db:
    image: postgres:16-alpine
    container_name: imot-postgres
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lena_password}
      POSTGRES_DB: lena_imot
    volumes:
      - imot_postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d lena_imot']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - premium-network

  app:
    image: imot:latest
    container_name: imot-app
    restart: always
    ports:
      - '3001:3001'
    environment:
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://lena_user:${DB_PASSWORD:-lena_password}@imot-postgres:5432/lena_imot?schema=public}

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

      # OAuth Providers
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_YANDEX_ID: ${AUTH_YANDEX_ID}
      AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET}

      # Email (SMTP via Maddy)
      SMTP_HOST: ${SMTP_HOST:-mail.letar.best}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-noreply@letar.best}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@imot.letar.best}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IMOT}

      # Application
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      CRON_SECRET: ${CRON_SECRET}

      # APIs
      NEXT_PUBLIC_DADATA_API_KEY: ${NEXT_PUBLIC_DADATA_API_KEY}
      NEXT_PUBLIC_YM_COUNTER_ID: ${NEXT_PUBLIC_YM_COUNTER_ID}
    volumes:
      - ./uploads:/app/apps/imot/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - premium-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  imot_postgres_data:
    driver: local

networks:
  premium-network:
    external: true
