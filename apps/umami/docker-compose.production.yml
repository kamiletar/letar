services:
  db:
    image: postgres:17-alpine
    container_name: umami-db
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: umami_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami_user -d umami']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kami-network

  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "umami-app" без изменений), stop_grace_period. ⚠️ Образ вендорский
  # (ghcr.io/umami-software/umami), не собирается нами локально — своих sha-тегов нет, поэтому
  # DEPLOY_TAG подставлен с дефолтом на текущий вендорский тег (`postgresql-latest`), а не на sha.
  # `rollback --to-sha` для этого приложения не имеет смысла (нет наших тегов образа) — годится
  # только обычный rollout (переразвёртывание того же тега без даунтайма).
  app:
    image: ghcr.io/umami-software/umami:${DEPLOY_TAG:-postgresql-latest}
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://umami_user:${DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
      TRACKER_SCRIPT_NAME: ${TRACKER_SCRIPT_NAME:-script}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/heartbeat || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
    networks:
      kami-network:
        aliases:
          - umami-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  umami_postgres_data:
    driver: local

networks:
  kami-network:
    external: true
