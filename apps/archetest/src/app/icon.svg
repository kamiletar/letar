<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Фон — скруглённый квадрат -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Символ Ψ (пси) — психология -->
  <g transform="translate(256, 240)" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Центральная линия -->
    <line x1="0" y1="-100" x2="0" y2="140"/>
    <!-- Левая дуга -->
    <path d="M0,-100 C0,-100 -90,-80 -90,10 C-90,60 -50,90 0,90"/>
    <!-- Правая дуга -->
    <path d="M0,-100 C0,-100 90,-80 90,10 C90,60 50,90 0,90"/>
  </g>
  <!-- Декоративные точки — 13 шкал (по кругу, как radar chart) -->
  <g fill="url(#accent)" opacity="0.7">
    <circle cx="256" cy="62" r="8"/>
    <circle cx="329" cy="72" r="6"/>
    <circle cx="389" cy="110" r="6"/>
    <circle cx="425" cy="168" r="6"/>
    <circle cx="432" cy="236" r="6"/>
    <circle cx="410" cy="302" r="6"/>
    <circle cx="365" cy="352" r="6"/>
    <circle cx="256" cy="418" r="8"/>
    <circle cx="147" cy="352" r="6"/>
    <circle cx="102" cy="302" r="6"/>
    <circle cx="80" cy="236" r="6"/>
    <circle cx="87" cy="168" r="6"/>
    <circle cx="123" cy="110" r="6"/>
  </g>
</svg>
