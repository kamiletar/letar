services:
  db:
    image: postgres:17-alpine
    container_name: archetest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: archetest
      POSTGRES_USER: archetest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - archetest-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5441:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archetest -d archetest']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kami-network

  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "archetest-app" без изменений), healthcheck (стандарт grandslamcup), image через
  # DEPLOY_TAG (rollback без пересборки).
  app:
    image: archetest:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      DATABASE_URL: postgresql://archetest:${POSTGRES_PASSWORD}@archetest-db:5432/archetest
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3012/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
      # §48 M3 шаг 5, пачка 2 — регистрация Traefik docker-provider роутера. Только регистрация,
      # трафик НЕ переключён (NPM продолжает форвардить напрямую на archetest-app:3012), см.
      # PLAN-INFRA-2.md §48 M3.
      traefik.enable: 'true'
      traefik.docker.network: 'kami-network'
      traefik.http.routers.archetest.rule: 'Host(`archetest.letar.best`)'
      traefik.http.routers.archetest.entrypoints: 'websecure'
      traefik.http.routers.archetest.tls.certresolver: 'dns'
      traefik.http.routers.archetest.tls.domains[0].main: 'letar.best'
      traefik.http.routers.archetest.tls.domains[0].sans[0]: '*.letar.best'
      traefik.http.services.archetest.loadbalancer.server.port: '3012'
    networks:
      kami-network:
        aliases:
          - archetest-app

volumes:
  archetest-data:

networks:
  kami-network:
    external: true
