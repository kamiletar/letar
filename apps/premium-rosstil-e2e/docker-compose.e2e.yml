# Docker Compose для E2E тестирования Premium РосСтиль
# Запуск: docker compose -f e2e/docker-compose.e2e.yml up -d
# Остановка: docker compose -f e2e/docker-compose.e2e.yml down

services:
  # Mailhog - тестовый SMTP сервер для перехвата email
  # Web UI: http://localhost:8025
  # SMTP: localhost:1025
  # API: http://localhost:8025/api/v2/messages
  mailhog:
    image: mailhog/mailhog:latest
    container_name: premium-rosstil-e2e-mailhog
    ports:
      - '1025:1025' # SMTP порт для отправки писем
      - '8025:8025' # Web UI для просмотра писем
    environment:
      - MH_STORAGE=memory
    restart: unless-stopped
