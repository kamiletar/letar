services:
  db:
    image: postgres:17-alpine
    container_name: auth-hub-db
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lena_auth
    volumes:
      - auth_hub_postgres_data:/var/lib/postgresql/data
    ports:
      - '5440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d lena_auth']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - kami-network

  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "auth-hub-app" без изменений), healthcheck (стандарт grandslamcup), image через
  # DEPLOY_TAG (rollback без пересборки). ⚠️ Ключница — SSO-хаб для ~10 hub-client приложений,
  # супервизируемый пилот обязателен (непрерывный curl-мониторинг во время деплоя).
  app:
    image: auth-hub:${DEPLOY_TAG:-latest}
    restart: always
    environment:
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: postgresql://lena_user:${DB_PASSWORD}@auth-hub-db:5432/lena_auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://auth.letar.best
      # At-rest шифрование clientSecret + токенов (Этап 8) — обязателен в production (db.ts)
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-https://kami.letar.best,https://animatrona.letar.best,https://tracker.letar.best,https://dash.letar.best,https://anime.letar.best,https://archetest.letar.best}
      # OAuth провайдеры
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_YANDEX_ID: ${AUTH_YANDEX_ID}
      AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET}
      AUTH_VK_ID: ${AUTH_VK_ID}
      AUTH_VK_SECRET: ${AUTH_VK_SECRET}
      AUTH_FACEBOOK_ID: ${AUTH_FACEBOOK_ID}
      AUTH_FACEBOOK_SECRET: ${AUTH_FACEBOOK_SECRET}
      # Email
      SMTP_HOST: ${SMTP_HOST:-mail.letar.best}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@letar.best}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@auth.letar.best}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Letar Auth}
      # Redis (rate-limit secondaryStorage)
      REDIS_URL: ${REDIS_URL:-redis://letar-redis:6379}
      # Analytics
      NEXT_PUBLIC_APP_URL: https://auth.letar.best
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      # Telegram Bot (уведомления при привязке/отвязке аккаунта)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # api.telegram.org заблокирован провайдером ДЦ на s1/s2 — прокси через mail сервер
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-https://tg-proxy.letar.best}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3010/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      kami-network:
        aliases:
          - auth-hub-app

volumes:
  auth_hub_postgres_data:
    driver: local

networks:
  kami-network:
    external: true
