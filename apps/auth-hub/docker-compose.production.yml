services:
  db:
    image: postgres:17-alpine
    container_name: auth-hub-postgres
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lena_password}
      POSTGRES_DB: lena_auth
    volumes:
      - auth_hub_postgres_data:/var/lib/postgresql/data
    ports:
      - '5440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d lena_auth']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - premium-network

  app:
    image: auth-hub:latest
    container_name: auth-hub-app
    restart: always
    ports:
      - '3010:3010'
    environment:
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: postgresql://lena_user:${DB_PASSWORD}@auth-hub-postgres:5432/lena_auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://auth.letar.best
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-https://kami.letar.best,https://animatrona.letar.best,https://tracker.letar.best,https://dash.letar.best,https://anime.letar.best,https://archetest.letar.best}
      # OAuth провайдеры
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_YANDEX_ID: ${AUTH_YANDEX_ID}
      AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET}
      AUTH_VK_ID: ${AUTH_VK_ID}
      AUTH_VK_SECRET: ${AUTH_VK_SECRET}
      AUTH_FACEBOOK_ID: ${AUTH_FACEBOOK_ID}
      AUTH_FACEBOOK_SECRET: ${AUTH_FACEBOOK_SECRET}
      # Email
      SMTP_HOST: ${SMTP_HOST:-mail.letar.best}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@letar.best}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@auth.letar.best}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Letar Auth}
      # Redis (rate-limit secondaryStorage)
      REDIS_URL: ${REDIS_URL:-redis://letar-redis:6379}
      # Analytics
      NEXT_PUBLIC_APP_URL: https://auth.letar.best
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - premium-network

volumes:
  auth_hub_postgres_data:
    driver: local

networks:
  premium-network:
    external: true
