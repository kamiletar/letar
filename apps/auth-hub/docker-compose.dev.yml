services:
  db:
    image: postgres:17-alpine
    container_name: auth-hub-postgres-dev
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: lena_password
      POSTGRES_DB: lena_auth
    volumes:
      - auth_hub_postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d lena_auth']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth_hub_postgres_dev_data:
    driver: local
