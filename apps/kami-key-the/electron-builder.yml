appId: com.letar.kami-key-the
productName: KamiKeyThe
copyright: Copyright © 2026

directories:
  output: dist-electron
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - '!node_modules'
      - '!node_modules/**/*'

extraMetadata:
  main: app/background.js

asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: KamiKeyThe

# Публикация на GitHub Releases — kamiletar/letar (публичный монорепо), релизы тегаются
# префиксом kami-key-the-v* (тот же паттерн, что animatrona/label-printer-desktop)
publish:
  provider: github
  owner: kamiletar
  repo: letar
  releaseType: release
  private: false

extraResources:
  - from: data/symbols.json
    to: data/symbols.json
  - from: resources/icon.png
    to: icon.png
  # koffi — нативный модуль (Win32 API), external в webpack (main/webpack.config.js).
  # bun isolated linker кладёт реальный пакет в .bun/, node_modules/koffi — симлинк, который
  # electron-builder не разворачивает при копировании (тот же класс проблемы — animatrona
  # решает так же для своих native-зависимостей, см. apps/animatrona/electron-builder.yml).
  # Кладём на реальный ФС рядом с app.asar — require('koffi') из background.js внутри asar
  # резолвится сюда по стандартному Node-алгоритму подъёма по node_modules.
  - from: ../../node_modules/.bun/koffi@3.2.1/node_modules/koffi
    to: node_modules/koffi
    filter:
      - '**/*'
  # Сам koffi.node — не в пакете koffi, а в отдельном опциональном платформенном пакете:
  # koffi ищет его по фиксированному относительному пути
  # `node_modules/koffi/src/koffi/../../../@koromix/koffi-{platform}-{arch}/koffi.node`
  # (см. resolveNative() в koffi/src/koffi/index.cjs) — без него падает с
  # "Cannot find the native Koffi module" при живом require('koffi') без ошибок.
  - from: ../../node_modules/.bun/@koromix+koffi-win32-x64@3.2.1/node_modules/@koromix/koffi-win32-x64
    to: node_modules/@koromix/koffi-win32-x64
    filter:
      - '**/*'
