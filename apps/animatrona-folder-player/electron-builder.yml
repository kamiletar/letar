appId: com.letar.animatrona-folder-player
productName: Animatrona Player
copyright: Copyright © 2026
electronVersion: 44.2.0

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - node_modules

extraMetadata:
  main: app/background.js

# Главный способ запуска плеера — двойной клик по файлу, не иконка на рабочем столе.
# Список расширений держать синхронно с VIDEO_EXTENSIONS в main/constants/file-filters.ts.
fileAssociations:
  - ext: [mkv, mp4, avi, webm, mov, wmv, flv, m4v, ts, m2ts]
    name: Видеофайл
    description: Видеофайл, воспроизводимый Animatrona Player
    role: Viewer
    icon: resources/icon.ico

# Нативные (.node) модули нельзя паковать в asar — добавляй сюда паттерны по мере
# появления зависимостей вроде sharp/canvas (см. .claude/rules/electron.md § «Грабли»)
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
    # Портативная сборка — запуск без установки (флешка, чужая машина). AppImage для Linux
    # уже портативен сам по себе, отдельного target'а там не нужно.
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Animatrona Player
  artifactName: '${productName}-Setup-${version}.${ext}'

portable:
  artifactName: '${productName}-portable-${version}.${ext}'

# Provider настроен для `--publish` в release-workflow — само автообновление в приложении
# (electron-updater) не подключено, включать только после первого реального релиза
# (см. apps/animatrona-folder-player/PLAN.md §8)
publish:
  provider: github
  owner: kamiletar
  repo: letar

extraResources:
  # Статический экспорт Next.js (без сервера — вся логика через Electron IPC)
  - from: renderer/out
    to: renderer/out
    filter:
      - '**/*'
