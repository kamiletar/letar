services:
  db:
    image: postgres:17-alpine
    container_name: time-db
    environment:
      POSTGRES_USER: time
      POSTGRES_PASSWORD: time_password
      POSTGRES_DB: time
    volumes:
      - time_postgres_dev:/var/lib/postgresql/data
    ports:
      - '5445:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U time -d time']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  time_postgres_dev:
