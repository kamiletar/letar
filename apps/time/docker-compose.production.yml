services:
  db:
    image: postgres:17-alpine
    container_name: time-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: time
      POSTGRES_USER: time
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - time-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5445:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U time -d time']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kami-network

  # Rollout-профиль (§18.6 Сессия G): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "time-app" без изменений), healthcheck (стандарт grandslamcup), image через
  # DEPLOY_TAG (rollback без пересборки). Dashboard теперь резолвит контейнер по <name>-N
  # суффиксу (apps/dashboard/src/lib/server-client/find-container.ts), так что отсутствие
  # container_name больше не ломает мониторинг. Label letar.rollout включён (сессия №68,
  # супервизируемый живой пилот — непрерывный curl-мониторинг обязателен во время деплоя,
  # мультиIP-поведение NPM ранее не проверялось вживую).
  app:
    image: time:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      DATABASE_URL: postgresql://time:${POSTGRES_PASSWORD}@time-db:5432/time
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3013/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
    networks:
      kami-network:
        aliases:
          - time-app

volumes:
  time-data:

networks:
  kami-network:
    external: true
