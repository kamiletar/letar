services:
  db:
    image: postgres:17-alpine
    container_name: grandslamcup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grandslamcup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grandslamcup-data:/var/lib/postgresql/data
    ports:
      - '5453:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grandslamcup']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - premium-network

  app:
    image: grandslamcup:latest
    container_name: grandslamcup-app
    restart: unless-stopped
    ports:
      - '3016:3016'
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@grandslamcup-db:5432/grandslamcup
    volumes:
      - ./uploads:/app/apps/grandslamcup/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3016/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - premium-network

volumes:
  grandslamcup-data:

networks:
  premium-network:
    external: true
