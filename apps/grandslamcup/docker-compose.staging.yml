name: grandslamcup-staging

services:
  db:
    image: postgres:17-alpine
    container_name: grandslamcup-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grandslamcup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grandslamcup-staging-data:/var/lib/postgresql/data
    ports:
      - '5454:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grandslamcup']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: grandslamcup:staging
    container_name: grandslamcup-staging-app
    restart: unless-stopped
    ports:
      - '${PORT:-3018}:3016'
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@grandslamcup-staging-db:5432/grandslamcup
    volumes:
      - ./uploads:/app/apps/grandslamcup/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:${PORT:-3016}/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  grandslamcup-staging-data:
