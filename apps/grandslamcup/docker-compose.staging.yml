name: grandslamcup-staging

services:
  db:
    image: postgres:17-alpine
    container_name: grandslamcup-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grandslamcup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grandslamcup-staging-data:/var/lib/postgresql/data
    ports:
      - '5454:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grandslamcup']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: grandslamcup:staging
    container_name: grandslamcup-staging-app
    restart: unless-stopped
    ports:
      # Хостовый порт захардкожен (не из PORT env — PORT в .env.staging это ВНУТРЕННИЙ порт
      # контейнера и раньше случайно перекрывал этот маппинг: env_file передавал ту же
      # переменную внутрь контейнера, из-за чего Next.js слушал 3018, а маппинг бил в 3016).
      - '3018:3016'
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@grandslamcup-staging-db:5432/grandslamcup
    volumes:
      - ./uploads:/app/apps/grandslamcup/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - traefik-network
    labels:
      # Маршрут описан здесь, а не в SQLite внутри NPM, — ради этого и затевался §48.
      traefik.enable: 'true'
      traefik.docker.network: 'traefik-network'
      traefik.http.routers.grandslamcup-stage.rule: 'Host(`grandslamcup-stage.s3.letar.best`)'
      traefik.http.routers.grandslamcup-stage.entrypoints: 'websecure'
      # ⛔ Без `certresolver` — сертификат уже выпущен (wildcard `*.s3.letar.best`), роутер его
      # только использует. Свой резолвер здесь заказал бы точечный сертификат на это имя и
      # упёрся бы в закрытую регистрацию acme-dns (`404`). Разбор — infra/traefik/README.md.
      traefik.http.routers.grandslamcup-stage.tls: 'true'
      # Порт КОНТЕЙНЕРА, не хостовый: Traefik ходит напрямую по сети traefik-network
      traefik.http.services.grandslamcup-stage.loadbalancer.server.port: '3016'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3016/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  grandslamcup-staging-data:

networks:
  # Traefik маршрутизирует только контейнеры в своей сети: docker-провайдер читает label'ы
  # контейнеров, а не адреса. Сеть создаётся один раз на сервере (docker network create).
  traefik-network:
    external: true
