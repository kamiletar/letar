services:
  db:
    image: postgres:17-alpine
    container_name: kami-db
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: lena_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lena_kami
    volumes:
      - kami_postgres_data:/var/lib/postgresql/data
    ports:
      - '5437:5432' # Порт 5437 для kami (5432=premium, 5433=imot, 5434=mandala, 5435=umami, 5436=dashboard)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lena_user -d lena_kami']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kami-network

  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "kami-app" без изменений), healthcheck (стандарт grandslamcup), image через
  # DEPLOY_TAG (rollback без пересборки).
  app:
    image: kami:${DEPLOY_TAG:-latest}
    restart: always
    environment:
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://lena_user:${DB_PASSWORD}@kami-postgres:5432/lena_kami?schema=public}

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3005}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

      # OIDC — Ключница (auth.letar.best), единственный способ входа в kami
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-https://auth.letar.best/api/auth/.well-known/openid-configuration}

      # Email (Maddy mail.letar.best)
      SMTP_HOST: ${SMTP_HOST:-mail.letar.best}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-noreply@letar.best}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@kami.letar.best}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Kami}

      # Redis (rate-limit secondaryStorage)
      REDIS_URL: ${REDIS_URL:-redis://letar-redis:6379}

      # Application
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3005}

      # Yandex Metrica
      NEXT_PUBLIC_YM_COUNTER_ID: ${NEXT_PUBLIC_YM_COUNTER_ID}

      # Umami Analytics (embedded at build time)
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}

      # Keystatic GitHub Storage
      KEYSTATIC_GITHUB_CLIENT_ID: ${KEYSTATIC_GITHUB_CLIENT_ID}
      KEYSTATIC_GITHUB_CLIENT_SECRET: ${KEYSTATIC_GITHUB_CLIENT_SECRET}
      KEYSTATIC_SECRET: ${KEYSTATIC_SECRET}
      NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG}
      GITHUB_PAT: ${GITHUB_PAT}

      # Telegram notifications (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    extra_hosts:
      # Facebook API заблокирован в РФ — проксируем через mail.letar.best
      - 'graph.facebook.com:172.18.0.200'
    volumes:
      - ./uploads:/app/apps/kami/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3005/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
    networks:
      kami-network:
        aliases:
          - kami-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  kami_postgres_data:
    driver: local

networks:
  kami-network:
    external: true
