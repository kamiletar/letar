services:
  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "animatrona-landing-app" без изменений), healthcheck (стандарт grandslamcup),
  # image через DEPLOY_TAG (rollback без пересборки).
  app:
    image: animatrona-landing:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      PORT: 3008
      # GitHub API для получения релизов (опционально)
      # Без токена работает, но с rate limit 60 запросов/час
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Секрет для instant revalidation кэша через GitHub Actions
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3008/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
      # §48 M3 шаг 5 — первый живой тест docker-провайдера Traefik на s2 (все прошлые роутеры
      # шли через file-провайдер, dynamic/s2/*.yml). Регистрация роутера НЕ переключает трафик —
      # NPM продолжает форвардить напрямую на animatrona-landing-app:3008, пока проксирование не
      # переключат отдельным действием (тот же механизм, что для aira.letar.best — см.
      # PLAN-INFRA-2.md §48 M3 шаг 3). Лейблы висят на сервисе, а не на конкретном контейнере —
      # обе реплики rollout-профиля (scale=2) получают тот же router-лейбл автоматически, Traefik
      # балансирует между ними сам, без сигнала reload (см. rollout.ts RolloutOptions.proxyKind).
      traefik.enable: 'true'
      traefik.docker.network: 'kami-network'
      traefik.http.routers.animatrona-landing.rule: 'Host(`animatrona.letar.best`)'
      traefik.http.routers.animatrona-landing.entrypoints: 'websecure'
      # certResolver+domains явно — bare `tls: true` на s2 не подхватывает wildcard
      # (infra/traefik/dynamic/s2/dashboard.yml, тот же урок, что и на s3 2026-08-07).
      traefik.http.routers.animatrona-landing.tls.certresolver: 'dns'
      traefik.http.routers.animatrona-landing.tls.domains[0].main: 'letar.best'
      traefik.http.routers.animatrona-landing.tls.domains[0].sans[0]: '*.letar.best'
      traefik.http.services.animatrona-landing.loadbalancer.server.port: '3008'
    networks:
      kami-network:
        aliases:
          - animatrona-landing-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
