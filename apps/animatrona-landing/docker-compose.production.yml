services:
  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "animatrona-landing-app" без изменений), healthcheck (стандарт grandslamcup),
  # image через DEPLOY_TAG (rollback без пересборки).
  app:
    image: animatrona-landing:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      PORT: 3008
      # GitHub API для получения релизов (опционально)
      # Без токена работает, но с rate limit 60 запросов/час
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Секрет для instant revalidation кэша через GitHub Actions
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3008/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
    networks:
      kami-network:
        aliases:
          - animatrona-landing-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
