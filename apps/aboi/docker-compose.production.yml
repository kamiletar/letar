services:
  db:
    image: postgres:17-alpine
    container_name: aboi-postgres
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: aboi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: neyroaboi_prod
    volumes:
      - aboi_postgres_data:/var/lib/postgresql/data
    # Порт 5444 свободный (5432=premium, 5437=kami, 5439=animatrona-tracker, 5441=archetest, 5443=aboi-dev локально, 5453=grandslamcup)
    ports:
      - '5444:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aboi_user -d neyroaboi_prod']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - premium-network

  app:
    image: aboi:latest
    container_name: aboi-app
    restart: always
    # На s2 порт 3018 занят grandslamcup-staging — наружу выводим 3019,
    # контейнерный порт (Next.js PORT) оставляем 3018.
    ports:
      - '3019:3018'
    environment:
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: postgresql://aboi_user:${DB_PASSWORD}@aboi-postgres:5432/neyroaboi_prod?schema=public

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

      # SMTP — Maddy на mail.letar.best
      SMTP_HOST: ${SMTP_HOST:-mail.letar.best}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@aboi.letar.best}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@aboi.letar.best}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-НейроАбоИ}

      # Application
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}

      # Реферальная программа (см. lib/referral.ts)
      ABOI_REFERRAL_PERCENT: ${ABOI_REFERRAL_PERCENT:-12}
      ABOI_REFERRAL_PENDING_DAYS: ${ABOI_REFERRAL_PENDING_DAYS:-14}
      ABOI_REFERRAL_COOKIE_TTL_DAYS: ${ABOI_REFERRAL_COOKIE_TTL_DAYS:-60}

      # Admin для seed (опционально, если делаем nx db:seed на проде)
      ABOI_ADMIN_EMAIL: ${ABOI_ADMIN_EMAIL}
      ABOI_ADMIN_PASSWORD: ${ABOI_ADMIN_PASSWORD}
      ABOI_ADMIN_NAME: ${ABOI_ADMIN_NAME:-Виталий}

      # DaData — опционально (если есть токен — на чекауте включается автодополнение адресов)
      NEXT_PUBLIC_DADATA_TOKEN: ${NEXT_PUBLIC_DADATA_TOKEN}

      # Umami Analytics
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}

      # Yandex Metrica (опционально, на staging не включаем)
      NEXT_PUBLIC_YM_COUNTER_ID: ${NEXT_PUBLIC_YM_COUNTER_ID}
    volumes:
      # Bind mount для загруженных изображений товаров
      - ./uploads:/app/apps/aboi/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - premium-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  aboi_postgres_data:
    driver: local

networks:
  premium-network:
    external: true
