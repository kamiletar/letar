<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Label Printer Desktop</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1a4c6e 0%, #2d6a8a 50%, #1a4c6e 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        -webkit-app-region: drag;
        user-select: none;
      }

      .splash-container {
        text-align: center;
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-container {
        width: 120px;
        height: 120px;
        margin: 0 auto 24px;
        background: white;
        border-radius: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .logo-icon {
        font-size: 48px;
      }

      .app-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }

      .app-subtitle {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 32px;
      }

      .loader {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .loader-dot {
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite;
      }

      .loader-dot:nth-child(1) {
        animation-delay: 0s;
      }
      .loader-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .status {
        margin-top: 24px;
        font-size: 12px;
        opacity: 0.7;
      }

      .version {
        position: fixed;
        bottom: 16px;
        right: 16px;
        font-size: 11px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo-container">
        <span class="logo-icon">🏷️</span>
      </div>
      <h1 class="app-name">LABEL PRINTER</h1>
      <p class="app-subtitle">Печать этикеток «Честный знак»</p>
      <div class="loader">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
      <p class="status">Загрузка приложения...</p>
    </div>
    <span class="version">v0.5.0</span>
  </body>
</html>
