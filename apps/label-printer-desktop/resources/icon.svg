<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#1a4c6e"/>

  <!-- Printer body -->
  <rect x="48" y="88" width="160" height="100" rx="8" fill="white"/>

  <!-- Printer paper slot -->
  <rect x="64" y="72" width="128" height="24" rx="4" fill="#e8e8e8"/>

  <!-- Printer paper (label) -->
  <rect x="80" y="56" width="96" height="40" rx="4" fill="white" stroke="#1a4c6e" stroke-width="2"/>

  <!-- DataMatrix placeholder on label -->
  <rect x="108" y="64" width="24" height="24" fill="#1a4c6e"/>
  <rect x="112" y="68" width="4" height="4" fill="white"/>
  <rect x="120" y="68" width="4" height="4" fill="white"/>
  <rect x="112" y="76" width="4" height="4" fill="white"/>
  <rect x="124" y="76" width="4" height="4" fill="white"/>

  <!-- Barcode on label -->
  <g fill="#1a4c6e">
    <rect x="88" y="68" width="1" height="16"/>
    <rect x="91" y="68" width="2" height="16"/>
    <rect x="95" y="68" width="1" height="16"/>
    <rect x="98" y="68" width="1" height="16"/>
    <rect x="101" y="68" width="2" height="16"/>
  </g>

  <!-- Printer button -->
  <circle cx="192" cy="128" r="12" fill="#4CAF50"/>

  <!-- Printer display -->
  <rect x="64" y="104" width="72" height="32" rx="4" fill="#1a4c6e"/>
  <text x="100" y="126" font-family="Arial" font-size="12" fill="white" text-anchor="middle">PRINT</text>

  <!-- Printed labels coming out -->
  <rect x="88" y="172" width="80" height="48" rx="4" fill="white" stroke="#1a4c6e" stroke-width="2"/>
  <rect x="96" y="180" width="16" height="16" fill="#1a4c6e" opacity="0.3"/>
  <g fill="#1a4c6e" opacity="0.3">
    <rect x="120" y="180" width="1" height="20"/>
    <rect x="124" y="180" width="2" height="20"/>
    <rect x="128" y="180" width="1" height="20"/>
    <rect x="132" y="180" width="1" height="20"/>
    <rect x="136" y="180" width="2" height="20"/>
    <rect x="140" y="180" width="1" height="20"/>
    <rect x="144" y="180" width="2" height="20"/>
    <rect x="148" y="180" width="1" height="20"/>
    <rect x="152" y="180" width="1" height="20"/>
    <rect x="156" y="180" width="2" height="20"/>
  </g>
</svg>
