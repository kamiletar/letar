<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Градиент фона — бирюзово-синий (IPFS/сеть), отличается от фиолетово-розового Animatrona -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0ea5e9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Фон с закруглёнными углами -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Узлы сети (IPFS peer-to-peer) — линии к центру -->
  <line x1="256" y1="256" x2="256" y2="96" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <line x1="256" y1="256" x2="400" y2="180" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <line x1="256" y1="256" x2="112" y2="180" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <line x1="256" y1="256" x2="400" y2="332" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <line x1="256" y1="256" x2="112" y2="332" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="256" cy="96" r="10" fill="white" opacity="0.85"/>
  <circle cx="400" cy="180" r="8" fill="white" opacity="0.7"/>
  <circle cx="112" cy="180" r="8" fill="white" opacity="0.7"/>
  <circle cx="400" cy="332" r="8" fill="white" opacity="0.7"/>
  <circle cx="112" cy="332" r="8" fill="white" opacity="0.7"/>

  <!-- Play-иконка в центре, чуть смещённый треугольник для оптического центрирования -->
  <circle cx="256" cy="256" r="92" fill="rgba(15,23,42,0.25)"/>
  <path d="M228 200 L332 256 L228 312 Z" fill="white"/>
</svg>
