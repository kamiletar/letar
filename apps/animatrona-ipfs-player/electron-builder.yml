appId: com.letar.animatrona-ipfs-player
productName: Animatrona IPFS Player
copyright: Copyright © 2026
electronVersion: 44.2.0

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - node_modules

extraMetadata:
  main: app/background.js

# Нативные (.node) модули нельзя паковать в asar — добавляй сюда паттерны по мере
# появления зависимостей вроде sharp/canvas (см. .claude/rules/electron.md § «Грабли»)
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Animatrona IPFS Player

# Без автообновления по умолчанию — если нужно, настрой provider: github и убери publish: null
publish: null

extraResources:
  # Статический экспорт Next.js (без сервера — вся логика через Electron IPC)
  - from: renderer/out
    to: renderer/out
    filter:
      - '**/*'
  # Kubo (Go IPFS) — полный узел для чтения/сидирования раздач по CID.
  # Бинарник НЕ в git (resources/kubo/ в .gitignore) — скачивается вручную перед сборкой,
  # тот же дистрибутив, что apps/animatrona/resources/kubo/win/kubo.exe
  - from: resources/kubo/win
    to: kubo/win
    filter:
      - kubo.exe
