# Project-wide Gradle settings.

# Java Home
org.gradle.java.home=C:/Android/jdk-17.0.13+11

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel execution
org.gradle.parallel=true

# Enable caching
org.gradle.caching=true

# Disable configuration cache (conflict with npx in RN autolink)
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true

# AGP 9.0+ built-in Kotlin support конфликтует с явным плагином org.jetbrains.kotlin.android,
# который применяют и :app, и exoplayer-ass/exoplayer-sync (Cannot add extension with name
# 'kotlin'). Временный официальный флаг отката — уберут в AGP 10, тогда придётся снимать
# org.jetbrains.kotlin.android со всех трёх модулей и переходить на builtin Kotlin.
android.builtInKotlin=false
android.newDsl=false

# Enable native architecture splits
reactNativeArchitectures=arm64-v8a,armeabi-v7a

# New Architecture (Fabric + TurboModules)
newArchEnabled=true

# Enable Hermes
hermesEnabled=true

# Release keystore
ANIMATRONA_UPLOAD_STORE_FILE=animatrona-release.keystore
ANIMATRONA_UPLOAD_STORE_PASSWORD=animatrona123
ANIMATRONA_UPLOAD_KEY_ALIAS=animatrona-key
ANIMATRONA_UPLOAD_KEY_PASSWORD=animatrona123
