# Dashboard Agent — Staging Configuration (s1.letar.best)
#
# Инстанс агента на s1 — сервере e2e-раннера и staging (до 2026-09-19 роль называлась `s3`). Управляет staging-деплоями
# (deploy_app target=staging → deploy-affected.sh --app X --staging через nsenter) и
# e2e-прогонами против staging-контейнеров (Сессия D плана deploy-mcp).
#
# Запуск (через deploy-agent-dev, s1 — прод-операция):
#   ./deploy-affected.sh --app dashboard-agent   (на самом s1; SERVER_NAME=s1 → guard пропустит)
#
# Отличия от docker-compose.production.yml (s2):
#   - НЕТ монтирования /secrets/*.env — на s1 нет прод-БД приложений, доступ к прод-
#     секретам не нужен (staging использует свои e2e/staging-БД).
#   - НЕТ монтирования ~/.ssh — git remote операции в контейнере не нужны; staging-деплой
#     идёт через nsenter в контексте ХОСТА (host SSH), не через контейнерный git.
#   - SERVER_NAME=s1.letar.best — getCurrentServer() вернёт 's1', серверный guard в
#     deploy.ts примет только target=staging (случайный прод-деплой на staging-раннер
#     невозможен).
#
# ⚠️ AGENT_TOKEN: .env.docker на s1 ДОЛЖЕН содержать ОТДЕЛЬНЫЙ токен, не равный
# прод-токену s2 (staging ниже по доверию). Раскладывается при provision s1 через
# deploy-agent-dev (openssl rand -base64 32), не переиспользуется из s2.

services:
  app:
    build:
      context: ../..
      dockerfile: apps/dashboard-agent/Dockerfile.production
    image: dashboard-agent:latest
    container_name: dashboard-agent
    restart: always
    # Запуск от root для выполнения команд на хосте через nsenter (staging-деплои)
    user: root
    # Требуется для nsenter (выполнение команд на хосте)
    pid: host
    privileged: true
    ports:
      # на старом s3 host:3100 был занят media-api → публикуем на 13103, и только на loopback:
      # SSH-туннель deploy-mcp достаёт (localhost:13103 на хосте), снаружи недоступен
      # (закрытие порта от интернета получаем даром, ufw не нужен). hostPort=13103
      # синхронизирован с libs/infra-config (SERVERS.s1.hostPort).
      - '127.0.0.1:13103:3100'
    env_file:
      - .env.docker
      # Локальный, НЕ коммитится (.gitignore: .env.*), только на s1. Прокидывает
      # DEV_SESSION_TOKEN/ALLOW_DEV_SESSION в spawn-окружение e2e-раннера (nsenter
      # наследует env этого процесса, см. routes/e2e.ts) — сюда, а НЕ в .env.docker(.enc),
      # по правилу из .claude/rules/env-files.md (эти две переменные никогда не должны
      # попасть в прод-секреты). required:false — деплой не падает, если файла ещё нет.
      - path: .env.s1-e2e.local
        required: false
    environment:
      TZ: Europe/Moscow
      NODE_ENV: production
      PORT: 3100
      HOST: 0.0.0.0
      SERVER_NAME: s1.letar.best
      # §81: nsenter-спавн deploy.ts/e2e.ts наследует env контейнера, не shell хоста —
      # .bashrc на s1 никогда не сорсится в этой цепочке. Здесь (git-файл, не секрет)
      # переменная переживает любой передеплой, в отличие от правки .env.docker,
      # которую deploy-affected.sh перезатирает расшифровкой .env.docker.enc.
      DEPLOY_SERVER_NAME: s1
      WORKSPACE_PATH: /home/deploy/letar
      # Отдельный токен s1: AGENT_TOKEN_S1 живёт в общем .env.docker(.enc), сюда
      # мапится как AGENT_TOKEN (переопределяет значение из env_file). Единый источник
      # в .enc → и s1-контейнер валидирует им, и локальный deploy-mcp им же
      # аутентифицируется (tokenForServer('s1') читает AGENT_TOKEN_S1). Требует
      # deploy-affected.sh --env-file .env.docker (уже так) или `--env-file` при ручном up.
      AGENT_TOKEN: ${AGENT_TOKEN_S1:?AGENT_TOKEN_S1 не задан — сгенерируй и добавь в .env.docker(.enc)}
    volumes:
      # Docker socket для управления staging-контейнерами
      - /var/run/docker.sock:/var/run/docker.sock
      # Git репозиторий (deploy-affected.sh запускается на хосте через nsenter)
      - ${WORKSPACE_PATH:-/home/deploy/letar}:/home/deploy/letar
      # Файл аккаунтов lego — лежит ВНЕ workspace, поэтому отдельной строкой.
      #
      # Нужен для бэкапа секретов Traefik (`traefik-backup.ts`, PLAN-INFRA.md §48 M2): здесь
      # три per-name аккаунта acme-dns (media/ipfs/gateway), и их потеря невосстановима без
      # владельца — регистрация закрыта, новый аккаунт даст новые fulldomain и потребует
      # переделать три CNAME у регистратора.
      #
      # ⚠️ Забыть эту строку — получать «нечего бэкапить» на каждом прогоне. Именно поэтому
      # источник в бэкапе обязательный, а не опциональный: молчаливо пустой архив выглядел бы
      # как защита. Только чтение — агент этот файл не меняет.
      - /home/deploy/lego:/home/deploy/lego:ro
    networks:
      - kami-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
