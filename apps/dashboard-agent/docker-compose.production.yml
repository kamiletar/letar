# Dashboard Agent Production Configuration
# Lightweight monitoring agent for remote servers
#
# Запуск: ./deploy-affected.sh --app dashboard-agent
#
# Требования:
# - Docker socket доступен
# - Сеть premium-network существует
# - Secrets файлы от приложений доступны

services:
  app:
    build:
      context: ../..
      dockerfile: apps/dashboard-agent/Dockerfile.production
    image: dashboard-agent:latest
    container_name: dashboard-agent
    restart: always
    # Запуск от root для чтения secrets файлов и выполнения команд на хосте
    user: root
    # Требуется для nsenter (выполнение команд на хосте)
    pid: host
    privileged: true
    ports:
      - '3100:3100'
    env_file:
      - .env.docker
    environment:
      TZ: Europe/Moscow
      NODE_ENV: production
      PORT: 3100
      HOST: 0.0.0.0
      SERVER_NAME: ${SERVER_NAME:-s1.letar.best}
      # Путь внутри контейнера (хостовый WORKSPACE_PATH монтируется сюда)
      WORKSPACE_PATH: /home/deploy/letar
    volumes:
      # Docker socket для управления контейнерами
      - /var/run/docker.sock:/var/run/docker.sock
      # Git репозиторий для git операций (REPO_PATH в lib/git.ts)
      - ${WORKSPACE_PATH:-/home/deploy/letar}:/home/deploy/letar
      # SSH ключи для git remote операций
      - ~/.ssh:/root/.ssh:ro
      # Secrets от приложений (для подключения к БД)
      # S1 — только dashboard-agent (premium-rosstil и imot переехали на s2)
      # (нет локальных приложений с БД)
    networks:
      - premium-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  premium-network:
    external: true
