# Dashboard Agent Production Configuration
# Lightweight monitoring agent for s2.letar.best
#
# Запуск: ./deploy-affected.sh --app dashboard-agent

services:
  app:
    build:
      context: ../..
      dockerfile: apps/dashboard-agent/Dockerfile.production
    image: dashboard-agent:latest
    container_name: dashboard-agent
    restart: always
    # Запуск от root для чтения secrets файлов и выполнения команд на хосте
    user: root
    # Требуется для nsenter (выполнение команд на хосте)
    pid: host
    privileged: true
    ports:
      # Только loopback (§49): агент privileged + docker.sock + ~/.ssh + все .env.docker —
      # самая ценная мишень на сервере, публиковать её в интернет нельзя.
      # Потребители не страдают: dashboard ходит по имени контейнера через kami-network
      # (LOCAL_AGENT_HOST: dashboard-agent), deploy-mcp — через SSH-туннель
      # `ssh -L <port>:localhost:3100`, который резолвит localhost уже на самом сервере.
      - '127.0.0.1:3100:3100'
    env_file:
      - .env.docker
    environment:
      TZ: Europe/Moscow
      NODE_ENV: production
      PORT: 3100
      HOST: 0.0.0.0
      SERVER_NAME: s2.letar.best
      WORKSPACE_PATH: /home/deploy/letar
      # Персистентность deploy-истории между рестартами контейнера (см. lib/redis.ts,
      # routes/deploy.ts). Опционально — без Redis деплой продолжает работать в
      # чистом in-memory режиме (graceful degradation).
      REDIS_URL: ${REDIS_URL:-redis://letar-redis:6379}
      # Этап 0.7 — канареечный мониторинг доставки email (см. lib/email-canary.ts)
      EMAIL_CANARY_SMTP_HOST: ${EMAIL_CANARY_SMTP_HOST}
      EMAIL_CANARY_SMTP_PORT: ${EMAIL_CANARY_SMTP_PORT}
      EMAIL_CANARY_SMTP_SECURE: ${EMAIL_CANARY_SMTP_SECURE}
      EMAIL_CANARY_SMTP_USER: ${EMAIL_CANARY_SMTP_USER}
      EMAIL_CANARY_SMTP_PASSWORD: ${EMAIL_CANARY_SMTP_PASSWORD}
      EMAIL_CANARY_INTERNAL_IMAP_HOST: ${EMAIL_CANARY_INTERNAL_IMAP_HOST}
      EMAIL_CANARY_INTERNAL_IMAP_PORT: ${EMAIL_CANARY_INTERNAL_IMAP_PORT}
      EMAIL_CANARY_INTERNAL_IMAP_SECURE: ${EMAIL_CANARY_INTERNAL_IMAP_SECURE}
      EMAIL_CANARY_EXTERNAL_RECIPIENT: ${EMAIL_CANARY_EXTERNAL_RECIPIENT}
      EMAIL_CANARY_EXTERNAL_IMAP_HOST: ${EMAIL_CANARY_EXTERNAL_IMAP_HOST}
      EMAIL_CANARY_EXTERNAL_IMAP_PORT: ${EMAIL_CANARY_EXTERNAL_IMAP_PORT}
      EMAIL_CANARY_EXTERNAL_IMAP_SECURE: ${EMAIL_CANARY_EXTERNAL_IMAP_SECURE}
      EMAIL_CANARY_EXTERNAL_IMAP_USER: ${EMAIL_CANARY_EXTERNAL_IMAP_USER}
      EMAIL_CANARY_EXTERNAL_IMAP_PASSWORD: ${EMAIL_CANARY_EXTERNAL_IMAP_PASSWORD}
    volumes:
      # Docker socket для управления контейнерами
      - /var/run/docker.sock:/var/run/docker.sock
      # Git репозиторий
      - ${WORKSPACE_PATH:-/home/deploy/letar}:/home/deploy/letar
      # SSH ключи для git remote операций
      - ~/.ssh:/root/.ssh:ro
      # Secrets от всех приложений (для подключения к БД)
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/driving-school/.env.docker:/secrets/driving-school.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/archetest/.env.docker:/secrets/archetest.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/auth-hub/.env.docker:/secrets/auth-hub.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/time/.env.docker:/secrets/time.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/dashboard/.env.docker:/secrets/dashboard.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/form-example/.env.docker:/secrets/form-example.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/mandala/.env.docker:/secrets/mandala.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/kami/.env.docker:/secrets/kami.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/umami/.env.docker:/secrets/umami.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/animatrona-tracker/.env.docker:/secrets/animatrona-tracker.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/grandslamcup/.env.docker:/secrets/grandslamcup.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/dsperevod/.env.docker:/secrets/dsperevod.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/svoichuzhie/.env.docker:/secrets/svoichuzhie.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/studio/.env.docker:/secrets/studio.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/aboi/.env.docker:/secrets/aboi.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/aprel8008/.env.docker:/secrets/aprel8008.env:ro
      - ${WORKSPACE_PATH:-/home/deploy/letar}/apps/domwellbes/.env.docker:/secrets/domwellbes.env:ro
    networks:
      - kami-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
