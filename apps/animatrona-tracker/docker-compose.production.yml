services:
  db:
    image: postgres:16-alpine
    container_name: animatrona-tracker-db
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: animatrona_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-animatrona_password}
      POSTGRES_DB: animatrona_tracker
    volumes:
      - animatrona_tracker_postgres_data:/var/lib/postgresql/data
    ports:
      - '5439:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U animatrona_user -d animatrona_tracker']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - premium-network

  redis:
    image: redis:7-alpine
    container_name: animatrona-tracker-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - premium-network

  app:
    image: animatrona-tracker:latest
    container_name: animatrona-tracker-app
    restart: always
    mem_limit: 1024m
    ports:
      - '${PORT:-3010}:3010' # Хост-порт конфигурируется через PORT env
    environment:
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://animatrona_user:${DB_PASSWORD:-animatrona_password}@animatrona-tracker-db:5432/animatrona_tracker?schema=public}
      REDIS_URL: redis://animatrona-tracker-redis:6379

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://animatrona-tracker.letar.best}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

      # OAuth Providers
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_YANDEX_ID: ${AUTH_YANDEX_ID}
      AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET}
      AUTH_VK_ID: ${AUTH_VK_ID}
      AUTH_VK_SECRET: ${AUTH_VK_SECRET}

      # Ключница OIDC
      BETTER_AUTH_OIDC_ISSUER: ${BETTER_AUTH_OIDC_ISSUER:-https://auth.letar.best}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-https://auth.letar.best/api/auth/.well-known/openid-configuration}

      # IPFS Gateway
      NEXT_PUBLIC_IPFS_GATEWAY: ${NEXT_PUBLIC_IPFS_GATEWAY:-https://gateway.letar.best}

      # Application
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://animatrona-tracker.letar.best}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - premium-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  animatrona_tracker_postgres_data:
    driver: local

networks:
  premium-network:
    external: true
