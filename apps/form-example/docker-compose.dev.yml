# Docker Compose для локальной разработки
# Запуск: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:17-alpine
    container_name: form-example-postgres-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: forms
      POSTGRES_DB: forms_example
    volumes:
      - form_example_postgres_dev:/var/lib/postgresql/data
    ports:
      - '5450:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forms -d forms_example']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  form_example_postgres_dev:
    driver: local
