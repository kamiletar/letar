services:
  db:
    image: postgres:17-alpine
    container_name: form-example-db
    restart: always
    environment:
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: forms_example
    volumes:
      - form-example-pgdata:/var/lib/postgresql/data
    networks:
      - kami-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forms -d forms_example']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # Rollout-профиль (§18.6 Сессия J, тираж после time/form-docs): нет container_name/ports
  # (zero-downtime требует scale=2), network alias вместо голого имени сети, healthcheck
  # (стандарт time/form-docs), image через DEPLOY_TAG. Label letar.rollout включён (2026-07-15) —
  # обычный деплой уже подтвердил, что снятие публикации хост-порта 3022 не ломает NPM-роутинг.
  app:
    image: form-example:${DEPLOY_TAG:-latest}
    restart: always
    env_file:
      - .env.docker
    environment:
      TZ: Europe/Moscow
      FORCE_COLOR: '1'
      NODE_ENV: production
      DATABASE_URL: postgresql://forms:${POSTGRES_PASSWORD}@form-example-db:5432/forms_example
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3022/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
    networks:
      kami-network:
        aliases:
          - form-example-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  form-example-pgdata:

networks:
  kami-network:
    external: true
