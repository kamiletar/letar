services:
  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет разрешение
  # имени "kami-key-the-landing-app" для NPM — тот же сетевой сегмент nginx-proxy-manager_default,
  # где живёт сам NPM), healthcheck (стандарт grandslamcup), image через DEPLOY_TAG (rollback без
  # пересборки).
  app:
    image: kami-key-the-landing:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE}
      NEXT_PUBLIC_GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE}
      TZ: Europe/Moscow
      # Форсировать цветной вывод в логах (ANSI в Docker без TTY)
      FORCE_COLOR: '1'
      NODE_ENV: production
      PORT: 3011
      # Umami аналитика
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3011/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
      # §48 M3 шаг 5, пачка 5 (последняя) — регистрация Traefik docker-provider роутера. Только
      # регистрация, трафик НЕ переключён (NPM продолжает форвардить напрямую на
      # kami-key-the-landing-app:3011), см. PLAN-INFRA-2.md §48 M3. Контейнер добавлен также в
      # kami-network — Traefik сидит только там, старая сеть nginx-proxy-manager_default
      # сохранена, чтобы NPM продолжал резолвить как раньше.
      traefik.enable: 'true'
      traefik.docker.network: 'kami-network'
      traefik.http.routers.kami-key-the-landing.rule: 'Host(`kamikeythe.letar.best`)'
      traefik.http.routers.kami-key-the-landing.entrypoints: 'websecure'
      traefik.http.routers.kami-key-the-landing.tls.certresolver: 'dns'
      traefik.http.routers.kami-key-the-landing.tls.domains[0].main: 'letar.best'
      traefik.http.routers.kami-key-the-landing.tls.domains[0].sans[0]: '*.letar.best'
      traefik.http.services.kami-key-the-landing.loadbalancer.server.port: '3011'
    networks:
      nginx-proxy-manager_default:
        aliases:
          - kami-key-the-landing-app
      kami-network:
        aliases:
          - kami-key-the-landing-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  nginx-proxy-manager_default:
    external: true
  kami-network:
    external: true
