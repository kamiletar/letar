services:
  # Rollout-профиль (§18.6 Сессия J): нет container_name/ports (zero-downtime требует scale=2,
  # который конфликтовал бы с обоими), network alias вместо голого имени сети (сохраняет NPM
  # Forward Host "pravda-app" без изменений), healthcheck (стандарт grandslamcup), image через
  # DEPLOY_TAG (rollback без пересборки). Простой кандидат для тиража: статический nginx-экспорт,
  # без БД и миграций.
  app:
    image: pravda:${DEPLOY_TAG:-latest}
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
      NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT}
      TZ: Europe/Moscow
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://0.0.0.0:3007/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s
    labels:
      letar.rollout: 'true'
      # §48 M3 шаг 5, пачка 3 — регистрация Traefik docker-provider роутера. Только регистрация,
      # трафик НЕ переключён (NPM продолжает форвардить напрямую на pravda-app:3007), см.
      # PLAN-INFRA-2.md §48 M3.
      traefik.enable: 'true'
      traefik.docker.network: 'kami-network'
      traefik.http.routers.pravda.rule: 'Host(`pravda.letar.best`)'
      traefik.http.routers.pravda.entrypoints: 'websecure'
      traefik.http.routers.pravda.tls.certresolver: 'dns'
      traefik.http.routers.pravda.tls.domains[0].main: 'letar.best'
      traefik.http.routers.pravda.tls.domains[0].sans[0]: '*.letar.best'
      traefik.http.services.pravda.loadbalancer.server.port: '3007'
    networks:
      kami-network:
        aliases:
          - pravda-app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  kami-network:
    external: true
