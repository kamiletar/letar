pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'AnimatronaTV'

include ':app'

// Подключаем exoplayer-ass модуль (ASS субтитры)
include ':exoplayer-ass'
project(':exoplayer-ass').projectDir = new File(rootProject.projectDir, '../../../libs/exoplayer-ass/android')

// Подключаем exoplayer-sync модуль (MergingMediaSource для видео+аудио)
include ':exoplayer-sync'
project(':exoplayer-sync').projectDir = new File(rootProject.projectDir, '../../../libs/exoplayer-sync/android')
